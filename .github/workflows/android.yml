# Fori para Android: compila la APK (carpeta android/) y, con la clave de firma, la publica en Releases.
# Secretos del repositorio: FORI_KEYSTORE (la clave en base64) y FORI_KEYSTORE_PASSWORD (su contraseña).
# Sin ellos solo se compila una APK de prueba (no se publica).
# Se publica al subir cambios de android/ a main o a mano (Actions → «APK de Android» → Run workflow).
# Enlace fijo a la última: https://github.com/ilinper301-hue/fori/releases/latest/download/Fori.apk
name: APK de Android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clave de firma
        id: clave
        env:
          FORI_KEYSTORE: ${{ secrets.FORI_KEYSTORE }}
          FORI_KEYSTORE_PASSWORD: ${{ secrets.FORI_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$FORI_KEYSTORE" ] && [ -n "$FORI_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$FORI_KEYSTORE" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/fori.keystore"
            echo "FORI_KEYSTORE_FILE=$RUNNER_TEMP/fori.keystore" >> "$GITHUB_ENV"
            echo "firmada=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Faltan los secretos FORI_KEYSTORE y FORI_KEYSTORE_PASSWORD: se compila una APK de prueba y no se publica."
          fi

      - name: Compilar
        working-directory: android
        env:
          FORI_KEYSTORE_PASSWORD: ${{ secrets.FORI_KEYSTORE_PASSWORD }}
          FORI_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ "${{ steps.clave.outputs.firmada }}" = "1" ]; then
            gradle --no-daemon --stacktrace assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../Fori.apk
          else
            gradle --no-daemon --stacktrace assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Fori.apk
          fi

      - name: Comprobar la APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/aapt2" dump badging Fori.apk | head -5
          "$BT/apksigner" verify --print-certs Fori.apk | head -5
          ls -la Fori.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Fori-apk-${{ github.run_number }}
          path: Fori.apk
          retention-days: 14

      - name: Publicar en Releases
        if: steps.clave.outputs.firmada == '1' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" Fori.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Fori para Android 1.0.${{ github.run_number }}" \
            --latest \
            --notes "APK de Fori para la PDI. Descárgala desde la pizarra con este enlace fijo (siempre la última): https://github.com/${{ github.repository }}/releases/latest/download/Fori.apk — Para actualizar, instálala encima: lo guardado se conserva."
