<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#13214A">
<title>Fori</title>
<meta name="description" content="Fori: pizarra y asamblea para el aula de primaria">
<!-- Añadir dentro de <head> (el theme-color ya existe en la página y se actualiza con el tema) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon-fav.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fori">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--r:18px;--font:"Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html[data-theme=light]{--board:#fff;--chrome:#e6ebf2;--panel:#f6f8fb;--ink:#14181d;--muted:#5b6672;--line:#cfd7e2;--accent:#1e6fe0;--accent-ink:#fff;--danger:#d9363e}
html[data-theme=dark]{--board:#15262a;--chrome:#0a1315;--panel:#1d3034;--ink:#f4f7f6;--muted:#9fb1b0;--line:#34504f;--accent:#4c9aff;--accent-ink:#061018;--danger:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--chrome);color:var(--ink);font-family:var(--font);user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
[contenteditable],textarea,input[type=text]{user-select:text;-webkit-user-select:text}
button{font-family:inherit;cursor:pointer}

:root{--ui:1}
#app{display:grid;height:100%;grid-template-columns:calc(96px*var(--ui)) 1fr calc(96px*var(--ui));grid-template-rows:calc(52px*var(--ui)) 1fr calc(80px*var(--ui));grid-template-areas:"top top top" "left stage right" "dock dock dock"}
/* tamaño de interfaz regulable: se escalan barras, menús y ventanas (no la pizarra) */
#top,aside,#dock,#pop>*,.win>header,.win>.body{zoom:var(--ui)}
.chip{display:none;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--panel);color:var(--ink);font-size:18px;font-weight:700}
#modeChip:empty{display:none}
.pair{display:flex;gap:6px;flex:none}
.tool.half{width:35px;min-height:48px;font-size:20px}
.tool:disabled{opacity:.35}
.dbtn.nav{padding:0 16px;font-size:22px}
.selbar{position:absolute;z-index:3;display:none;gap:8px}
.selbar button{width:52px;height:52px;border-radius:14px;border:0;background:var(--panel);color:var(--ink);font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.txted{position:absolute;z-index:3;min-height:1.2em;margin:0;padding:0;background:transparent;border:3px dashed var(--accent);border-radius:6px;outline:none;resize:none;overflow:hidden;font-weight:600;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.2;white-space:pre}
.inl{display:flex!important;align-items:center;gap:10px;font-size:17px!important}
.din{font-size:18px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--board);color:var(--ink)}

/* barra superior */
#top{grid-area:top;display:flex;align-items:center;gap:18px;padding:0 10px;font-size:22px;font-weight:600}
#top .sp{flex:1}
#dateStr{white-space:nowrap}
#clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:26px}
#subject{background:var(--panel);padding:4px 16px;border-radius:999px;font-size:20px;display:none}
.mini{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--muted);font-size:22px;opacity:.65;position:relative}
.mini.holding::after{content:"";position:absolute;inset:0;border-radius:12px;border:3px solid var(--accent);animation:hold .7s linear}
@keyframes hold{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* barras laterales */
aside{display:flex;flex-direction:column;gap:8px;padding:8px;overflow-y:auto;align-items:center;scrollbar-width:none}
aside::-webkit-scrollbar{display:none}
#left{grid-area:left}#right{grid-area:right}
.tool{width:76px;min-height:64px;border-radius:var(--r);border:3px solid transparent;background:var(--panel);color:var(--ink);font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:none;padding:4px 0}
.tool small{font-size:12px;font-weight:700;color:var(--muted)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
.tool:active,.btn:active,.dbtn:active{transform:scale(.95)}
.sep{width:60px;height:2px;background:var(--line);flex:none;margin:4px 0}
.grid2{display:grid;grid-template-columns:repeat(2,38px);gap:8px;justify-content:center;flex:none}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 4px var(--accent)}
.sz{width:76px;height:42px;border-radius:14px;border:3px solid transparent;background:var(--panel);display:grid;place-items:center;flex:none}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz.on{border-color:var(--accent)}

/* escenario */
#stage{grid-area:stage;position:relative;background:var(--board);border-radius:20px;overflow:hidden;box-shadow:0 0 0 2px var(--line)}
#stage canvas,#bgimg{position:absolute;inset:0;width:100%;height:100%}
#bgimg{background:center/contain no-repeat}
#draw{touch-action:none;cursor:crosshair}
#live{pointer-events:none}
#floaters{position:absolute;inset:0;pointer-events:none;z-index:1}

/* base 10 */
#manip{position:absolute;inset:0;pointer-events:none;z-index:0}
.piece{position:absolute;pointer-events:auto;touch-action:none;cursor:grab;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.piece svg{display:block}
.piece.drag{filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));cursor:grabbing}
.piece.anim{transition:left .35s,top .35s}
.mat{position:absolute;inset:0;display:none;grid-template-columns:repeat(3,1fr)}
.mat.on{display:grid}
.mat>div{border-right:3px dashed var(--line);text-align:center;padding-top:6px}
.mat>div:last-child{border-right:0}
.mat b{display:block;font-size:44px;line-height:1}
.mat span{font-size:18px;color:var(--muted);font-weight:700}
#trash{position:absolute;right:18px;bottom:18px;width:120px;height:120px;border-radius:26px;display:none;place-items:center;font-size:56px;background:var(--panel);border:4px dashed var(--danger);z-index:2;pointer-events:none}
#trash.hot{background:var(--danger)}
.addp{min-height:72px;padding:0 18px;border-radius:16px;border:0;color:#fff;font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.addp i{display:block;background:rgba(255,255,255,.85);border-radius:3px}
.pv{display:grid;grid-template-columns:repeat(3,1fr) 1.3fr;gap:8px;margin:14px 0;text-align:center}
.pv div{background:var(--chrome);border-radius:14px;padding:6px}
.pv b{display:block;font-size:46px;line-height:1.1;font-variant-numeric:tabular-nums}
.pv span{font-size:15px;font-weight:700;color:var(--muted)}
.pv .tot b{color:var(--accent)}
.numin{width:130px;min-height:56px;font-size:28px;font-weight:700;text-align:center;border-radius:14px;border:2px solid var(--line);background:var(--board);color:var(--ink)}

/* regla */
.ruler{position:absolute;pointer-events:auto;touch-action:none;cursor:grab;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.ruler svg{display:block}
.rrot{position:absolute;top:27px;width:56px;height:56px;border-radius:50%;background:#1e6fe0;color:#fff;display:grid;place-items:center;font-size:30px;touch-action:none;cursor:alias;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.rbtns{position:absolute;right:10px;bottom:8px;display:flex;gap:6px}
.rbtns button{width:46px;height:42px;border-radius:10px;border:0;background:rgba(0,0,0,.13);color:#2b2108;font-size:20px}
.rang{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:26px;font-weight:800;color:#2b2108;display:none;background:rgba(255,255,255,.7);padding:0 10px;border-radius:8px}

/* dinero */
.mbtn{border:0;background:var(--chrome);border-radius:14px;padding:6px;min-width:64px;min-height:64px;display:grid;place-items:center}
.mbtn.coin svg{width:auto;height:56px}
.mbtn.bill svg{width:auto;height:46px}
.mbtn:active{transform:scale(.93)}
.eurtot{font-size:56px;font-weight:800;text-align:center;color:var(--accent);font-variant-numeric:tabular-nums;margin:8px 0}
.target{font-size:34px;font-weight:800;min-width:160px;text-align:center;font-variant-numeric:tabular-nums}
.res{font-size:26px;font-weight:800;text-align:center;min-height:36px;margin-top:8px}
.lbl{font-size:16px;font-weight:700;color:var(--muted);margin:10px 0 6px}

/* reloj */
.clk{display:block;margin:6px auto 0;touch-action:none;max-width:100%;height:auto}
.dig{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.dig small{font-size:28px}
.words{font-size:26px;font-weight:700;text-align:center;min-height:36px;color:var(--accent)}

/* ventanas flotantes */
.win{position:absolute;pointer-events:auto;background:var(--panel);color:var(--ink);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.35);border:2px solid var(--line);display:flex;flex-direction:column;max-width:96%;max-height:96%}
.win>header{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 18px;font-weight:700;font-size:20px;touch-action:none;cursor:grab;border-bottom:2px solid var(--line)}
.win>header span{flex:1}
.win .x{width:46px;height:46px;border-radius:12px;border:0;background:var(--chrome);color:var(--ink);font-size:20px}
.win>.body{padding:16px;overflow:auto}

.btn{min-height:56px;padding:0 20px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-size:22px;font-weight:700}
.btn.ghost{background:var(--chrome);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.big{font-size:34px;min-width:76px}
.btn.tog.on{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.c{justify-content:center}
.big{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:18px;text-align:center}
.seg{display:flex;background:var(--chrome);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;min-height:52px;border:0;border-radius:12px;background:transparent;color:var(--ink);font-size:20px;font-weight:700}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* temporizador */
.ringbox{position:relative;width:260px;height:260px;margin:12px auto}
.ringbox svg{display:block}
.ringnum{position:absolute;inset:0;display:grid;place-items:center;font-size:58px;font-weight:800;font-variant-numeric:tabular-nums}
.ringnum.done{animation:pulse .5s 6 alternate;color:var(--danger)}
@keyframes pulse{to{transform:scale(1.15)}}

/* selector, grupos, encargados, horario */
.pick{font-size:52px;font-weight:800;text-align:center;min-height:130px;display:grid;place-items:center;word-break:break-word;color:var(--accent)}
.pick.spin{opacity:.55}
.chk{display:flex;align-items:center;gap:12px;font-size:20px;margin:8px 0 14px}
.chk input{width:28px;height:28px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:14px}
.gcard{background:var(--chrome);border-radius:16px;padding:12px;font-size:22px;border-left:8px solid var(--accent)}
.gcard b{display:block;margin-bottom:4px;color:var(--accent)}
.rrow{display:flex;justify-content:space-between;gap:16px;padding:12px 8px;border-bottom:2px solid var(--line);font-size:24px}
.rl{color:var(--muted)}
.srow{display:flex;gap:14px;padding:12px 10px;border-radius:14px;font-size:26px;font-weight:600}
.srow.now{background:var(--accent);color:var(--accent-ink)}
.st{font-variant-numeric:tabular-nums;opacity:.8;min-width:140px}

/* contadores y ruido */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.team{background:var(--chrome);border-top:10px solid var(--c);border-radius:18px;padding:12px;text-align:center}
.tn{font-size:24px;font-weight:700;outline:none;min-height:34px}
.tv{font-size:84px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.nbar{height:36px;background:var(--chrome);border-radius:18px;overflow:hidden;margin:14px 0}
.nbar i{display:block;height:100%;width:0;transition:width .1s}
input[type=range]{width:100%;height:40px}

/* notas adhesivas */
.note{position:absolute;width:240px;min-height:200px;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.3);color:#1b1f24;pointer-events:auto;display:flex;flex-direction:column;transform:rotate(-1.5deg)}
.nh{display:flex;justify-content:flex-end;gap:4px;padding:4px;cursor:grab;touch-action:none;background:rgba(0,0,0,.08)}
.nh button{width:42px;height:42px;border:0;background:transparent;font-size:20px}
.nb{flex:1;padding:10px;font-size:24px;outline:none;font-family:"Segoe Print","Comic Sans MS",cursive,var(--font)}

/* dock */
#dock{grid-area:dock;display:flex;align-items:center;gap:10px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
#dock .sp{flex:1}
.dbtn{min-height:60px;padding:0 22px;border-radius:16px;border:3px solid transparent;background:var(--panel);color:var(--ink);font-size:20px;font-weight:700;white-space:nowrap;flex:none}
.dbtn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
.dbtn.danger{background:var(--danger);color:#fff}

/* popover de formas */
#pop{position:fixed;z-index:700;display:none;gap:8px;padding:12px;background:var(--panel);border-radius:20px;box-shadow:0 12px 40px #0005;border:2px solid var(--line)}
#pop button{height:68px;min-width:68px;border-radius:14px;border:3px solid transparent;background:var(--chrome);color:var(--ink);font-size:30px}
#pop button.on{border-color:var(--accent)}
#pop .wide{grid-column:1/-1;font-size:20px;font-weight:700}
#pop .psw{width:60px;height:60px;min-width:0;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line)}
#pop .psw.on{box-shadow:0 0 0 5px var(--accent)}
.custom{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;padding:4px}
.custom input{width:72px;height:56px;border:0;padding:0;background:none}
.curc{width:42px;height:42px;border-radius:50%;border:6px solid transparent;background:linear-gradient(var(--c,#111),var(--c,#111)) padding-box,conic-gradient(#e03131,#fcc419,#2f9e44,#15aabf,#1e6fe0,#ae3ec9,#e03131) border-box}
#dock .dsep{width:2px;height:44px;background:var(--line);flex:none;margin:0 4px}

/* foco */
#spot{position:fixed;inset:0;z-index:900;display:none;touch-action:none}
#spotCtl{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:901;display:none;gap:10px;background:var(--panel);padding:10px;border-radius:20px;box-shadow:0 8px 30px #0006}

/* aviso */
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111e;color:#fff;padding:12px 20px;border-radius:16px;display:none;gap:14px;align-items:center;font-size:20px;z-index:2000}

/* ajustes */
dialog{border:0;border-radius:24px;padding:24px;width:min(900px,94vw);max-height:92vh;overflow:auto;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:#000a}
dialog h2{margin:0 0 12px}dialog h3{margin:18px 0 8px}
dialog textarea{width:100%;font:inherit;font-size:17px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--board);color:var(--ink);resize:vertical}
dialog select{font-size:18px;padding:10px;border-radius:12px}
dialog label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sched{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.row.end{justify-content:flex-end;margin-top:18px}
/* matemáticas */
.prot{position:absolute;pointer-events:none;touch-action:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.28))}
.prot svg{display:block;pointer-events:none}
.prot .pbody{pointer-events:auto;cursor:grab}
.prot .ph{pointer-events:auto;cursor:pointer}
.prot-h{position:absolute;width:56px;height:56px;border-radius:50%;border:0;background:#1e6fe0;color:#fff;display:grid;place-items:center;font-size:30px;touch-action:none;cursor:alias;pointer-events:auto;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.prot-x{width:52px;height:52px;background:var(--danger);font-size:22px;cursor:pointer;padding:0}
.mlinfo{font-size:32px;font-weight:800;text-align:center;min-height:44px;margin-top:8px;font-variant-numeric:tabular-nums}
.frbox{display:flex;justify-content:center}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-size:84px;font-weight:800;line-height:1.05;min-width:90px}
.fr i{display:block;height:7px;width:100%;background:var(--ink);border-radius:4px;margin:6px 0}
.fp{fill:var(--board);stroke:var(--ink);stroke-width:3;stroke-linejoin:round;cursor:pointer}
.fp.on{fill:#f08c00}
.h100{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.hc{min-height:48px;padding:0;border-radius:10px;border:2px solid var(--line);background:var(--board);color:var(--ink);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.hc.c1{background:#ffd43b;color:#14181d}.hc.c2{background:#74c0fc;color:#14181d}.hc.c3{background:#69db7c;color:#14181d}
.hc.hl{box-shadow:inset 0 0 0 4px var(--accent);border-color:var(--accent);font-weight:900}
.hc.hid{background:var(--chrome)}
.die{border:0;background:transparent;padding:4px;border-radius:20px;touch-action:manipulation}
.die.roll{animation:wob .14s infinite alternate}
@keyframes wob{from{transform:rotate(-10deg) scale(.95)}to{transform:rotate(10deg) scale(1.05)}}
.gchip{background:var(--chrome);border-left:10px solid;border-radius:12px;padding:8px 14px;font-size:20px;font-weight:700}


/* asamblea, semáforo y pictogramas */
.as-tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1;font-size:18px;min-height:68px;padding:4px 2px}
.as-tabs button span{font-size:28px}
.as-big2{font-size:26px;font-weight:800;text-align:center;margin-bottom:10px}
.as-head{display:flex;align-items:center;gap:10px}
.as-mt{flex:1;font-size:30px;font-weight:800;text-align:center}
.as-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.as-wd{text-align:center;font-size:20px;color:var(--muted);padding:4px 0}
.as-d{min-height:56px;display:grid;place-items:center;font-size:26px;font-weight:700;border-radius:12px;background:var(--chrome);font-variant-numeric:tabular-nums}
.as-d.off{opacity:.4;background:transparent;color:var(--muted)}
.as-d.today{opacity:1;background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}
.as-now{display:flex;align-items:center;justify-content:center;gap:18px;font-size:40px;font-weight:800;text-align:center;min-height:110px;color:var(--accent)}
.as-e{font-size:84px;line-height:1}
.as-wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.as-wb{min-height:112px;border-radius:18px;border:4px solid transparent;background:var(--chrome);color:var(--ink);font-size:18px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 2px;line-height:1.15}
.as-wb span{font-size:46px;line-height:1}
.as-wb.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
.as-season{display:flex;align-items:center;gap:16px;background:var(--chrome);border-radius:18px;padding:12px 18px;font-size:24px}
.as-e2{font-size:52px;line-height:1}
.as-er{display:grid;grid-template-columns:210px 1fr 44px 52px;gap:10px;align-items:center;margin-bottom:8px}
.as-eb{min-height:56px;border-radius:16px;border:0;background:var(--chrome);color:var(--ink);font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;padding:0 14px}
.as-eb span{font-size:36px;line-height:1}
.as-eb:active{transform:scale(.96)}
.as-bar{height:34px;background:var(--chrome);border-radius:17px;overflow:hidden}
.as-bar i{display:block;height:100%;transition:width .2s}
.as-n{font-size:30px;text-align:center;font-variant-numeric:tabular-nums}
.as-m{min-height:48px;min-width:48px;padding:0;font-size:28px}
.as-bigday{font-size:140px;line-height:1.05;color:var(--accent)}
.as-sc{width:240px;height:240px;border-radius:50%;margin:8px auto 18px;display:grid;place-items:center;font-size:120px;line-height:1}
.as-sn{font-size:52px;font-weight:800;text-align:center;line-height:1.1}
.as-sd{font-size:28px;text-align:center;color:var(--muted);margin:6px 0 16px;font-weight:600}
.as-sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.as-sb{min-height:76px;border-radius:18px;border:5px solid transparent;background:var(--c);color:var(--t);font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
.as-sb span{font-size:36px}
.as-sb.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--panel) inset}
.as-sb:active{transform:scale(.96)}
#modeChip{display:none;align-items:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;font-size:20px;font-weight:800;cursor:pointer;white-space:nowrap}
.picto{display:none;height:56px;width:auto;max-width:72px;object-fit:contain;flex:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:2px;pointer-events:none}
.picto.ok{display:block}
.srow.p,.rrow.p{align-items:center}
.rg{display:flex;align-items:center;gap:14px;min-width:0}
.credit{font-size:13px;line-height:1.35;color:var(--muted);margin:14px 4px 0}

/* modos de pantalla */
body.v-mini #top,body.v-mini aside,body.v-mini #dock,body.v-clean #top,body.v-clean aside,body.v-clean #dock{display:none}
body.v-mini #app,body.v-clean #app{grid-template-columns:0 1fr 0;grid-template-rows:0 1fr 0}
body.v-mini #stage,body.v-clean #stage{border-radius:0;box-shadow:none}
#mini{position:fixed;z-index:650;display:none;align-items:center;gap:6px;padding:8px;background:var(--panel);border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.3);border:2px solid var(--line)}
body.v-mini #mini{display:flex}
#mini>*{zoom:var(--ui)}
#mini button{width:56px;height:56px;border-radius:14px;border:3px solid transparent;background:var(--chrome);color:var(--ink);font-size:26px;display:grid;place-items:center;padding:0;flex:none}
#mini button.on{border-color:var(--accent)}
#mini .msw{width:44px;height:44px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line)}
#mini .msw.on{box-shadow:0 0 0 4px var(--accent)}
#mini .grip{width:30px;height:56px;display:grid;place-items:center;font-size:26px;color:var(--muted);cursor:grab;touch-action:none}
#mini .mdot{display:block;border-radius:50%;background:var(--ink)}
#cornerBtn{position:fixed;right:12px;bottom:12px;z-index:650;width:52px;height:52px;border-radius:50%;border:0;background:rgba(127,127,127,.18);color:var(--muted);font-size:22px;display:none;opacity:.55;place-items:center}
body.v-clean #cornerBtn{display:grid}
#cornerBtn.holding{box-shadow:0 0 0 4px var(--accent)}

/* regletas */
.cuisgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cuisb{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 12px;border:0;border-radius:14px;background:var(--chrome);color:var(--ink);font-size:20px;font-weight:800}
.cuisb i{display:block;height:26px;border:2px solid;border-radius:4px;flex:none;max-width:200px}

/* tangram */
.tansil{position:absolute;inset:0;pointer-events:none}
.piece.tan{pointer-events:none}
.piece.tan polygon{pointer-events:auto}
.tanfig{display:inline-flex;gap:4px}
.btn.tdel{min-width:48px;padding:0 10px}
.tanres{font-size:20px;font-weight:700;color:var(--ink)}
.tanres.ok{color:var(--teal)}
/* ================= Estilo Fori (a partir del icono) ================= */
@font-face{font-family:'Inter';src:url(fonts/inter-400.woff) format('woff');font-weight:400;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-500.woff) format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-600.woff) format('woff');font-weight:600 800;font-display:swap}
:root{
  --font:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --teal:#27C1B0;--yellow:#FFC845;--coral:#F4664A;--purple:#7444E0;
  --frame:#13214A;--frame2:#1C2D5E;--frame3:#2A3D75;--on-frame:#EEF2FA;--on-frame2:#9DA9CC;
  --r:14px;
}
html[data-theme=light]{--board:#FFFFFF;--chrome:#EEF1F7;--panel:#FFFFFF;--ink:#16203B;--muted:#5E6884;--line:#DDE2EC;--accent:#0F8F82;--accent-ink:#FFFFFF;--danger:#E2533B}
html[data-theme=dark]{--board:#18233F;--chrome:#26335A;--panel:#1D2849;--ink:#EEF2FA;--muted:#A3AECF;--line:#34416C;--accent:#27C1B0;--accent-ink:#0B1530;--danger:#FF7A5C;--frame:#0B1430;--frame2:#15214A;--frame3:#22315F}
html,body{background:var(--frame);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:var(--font)}
/* franja de marca: las cuatro regletas del icono */
body::before{content:"";position:fixed;z-index:5;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--teal) 0 25%,var(--yellow) 25% 50%,var(--coral) 50% 75%,var(--purple) 75%)}
body.v-mini::before,body.v-clean::before{display:none}

/* iconos */
.ico{display:inline-grid;place-items:center;width:1em;height:1em;flex:none}
.ico svg{width:100%;height:100%}

/* barra superior */
#top{color:var(--on-frame);font-size:18px;font-weight:500;gap:14px;padding:4px 12px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;letter-spacing:-.01em;margin-right:6px}
.brand img{height:26px;display:block}
.brand-sep{width:1px;height:24px;background:rgba(255,255,255,.14)}
#dateStr{color:var(--on-frame2);font-weight:500}
#clock{font-size:22px;font-weight:700;color:var(--on-frame);letter-spacing:.01em}
#subject{background:var(--frame2);color:var(--on-frame);font-size:16px;font-weight:600;padding:5px 14px}
.mini{color:var(--on-frame2);opacity:1;font-size:22px;border-radius:10px;display:grid;place-items:center}
.mini:hover{background:var(--frame2);color:var(--on-frame)}
.chip{background:var(--frame2);color:var(--on-frame);font-size:16px;font-weight:600;gap:8px}
.chip .ico{font-size:18px}

/* barras laterales */
aside{gap:4px;padding:6px 8px}
.tool{background:transparent;color:var(--on-frame2);border:0;border-radius:12px;min-height:60px;gap:4px;font-size:26px;position:relative}
.tool small{font-size:11px;font-weight:600;color:inherit;letter-spacing:.01em}
.tool:hover{background:var(--frame2);color:var(--on-frame)}
.tool.on{background:rgba(39,193,176,.16);color:var(--teal)}
.tool.on::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--teal)}
#right .tool.on{background:rgba(255,200,69,.14);color:var(--yellow)}
#right .tool.on::before{left:auto;right:-8px;border-radius:3px 0 0 3px;background:var(--yellow)}
.tool.half{font-size:20px;min-height:44px}
.sep{background:rgba(255,255,255,.1);width:56px;margin:6px 0}
.sw{border-color:var(--frame);box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.sw.on{box-shadow:0 0 0 3px var(--teal)}
.sz{background:transparent;border:0;border-radius:10px}
.sz i{background:var(--on-frame2)}
.sz.on{background:rgba(39,193,176,.16)}.sz.on i{background:var(--teal)}
.curc{width:34px;height:34px;border-width:4px}

/* escenario */
#stage{border-radius:16px;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.25)}
body.v-mini #stage,body.v-clean #stage{box-shadow:none}

/* barra inferior */
#dock{gap:8px;padding:0 12px}
.dbtn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 18px;border:0;border-radius:12px;background:var(--frame2);color:var(--on-frame);font-size:17px;font-weight:600}
.dbtn .ico{font-size:22px;color:var(--on-frame2)}
.dbtn:hover{background:var(--frame3)}
.dbtn.on{box-shadow:inset 0 0 0 2px var(--teal)}
.dbtn.nav{padding:0 14px}.dbtn.nav .ico{color:var(--on-frame)}
.dbtn.danger{background:var(--coral);color:#fff}.dbtn.danger .ico{color:#fff}
#dock .dsep{background:rgba(255,255,255,.12);height:32px}

/* menús emergentes */
#pop{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(9,16,40,.35);padding:8px;gap:6px}
#pop button{background:transparent;border:0;border-radius:10px;color:var(--ink);font-size:24px}
#pop button:hover{background:var(--chrome)}
#pop button.on{background:rgba(15,143,130,.12);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
#pop .wide{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600;height:auto;min-height:50px;padding:0 16px;text-align:left}
#pop .wide .ico{font-size:22px;color:var(--muted)}
#pop .wide.on .ico{color:var(--accent)}
#pop .psw{box-shadow:0 0 0 1px var(--line)}
#pop .psw.on{box-shadow:0 0 0 4px var(--accent)}

/* ventanas */
.win{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(9,16,40,.32)}
.win>header{font-size:17px;font-weight:700;padding:8px 8px 8px 18px;border-bottom:1px solid var(--line);color:var(--ink);letter-spacing:-.005em}
.win>header::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--wc,var(--teal));margin-right:2px}
.win .x{width:42px;height:42px;border-radius:10px;background:transparent;color:var(--muted);font-size:20px;display:grid;place-items:center}
.win .x:hover{background:var(--chrome);color:var(--ink)}
.btn{border-radius:12px;font-size:18px;font-weight:600;min-height:52px}
.btn.ghost{background:var(--chrome);color:var(--ink)}
.seg{border-radius:12px}
.seg button{border-radius:9px;font-size:17px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--panel)}
.btn.tog.on{background:var(--accent);color:var(--accent-ink)}
.muted{font-size:16px}

/* barra mínima, botón de esquina, aviso, selección */
#mini{background:var(--frame);border:1px solid rgba(255,255,255,.08);border-radius:18px;box-shadow:0 16px 40px rgba(9,16,40,.4)}
#mini button{background:transparent;color:var(--on-frame2);border:0;font-size:24px}
#mini button:hover{background:var(--frame2);color:var(--on-frame)}
#mini button.on{background:rgba(39,193,176,.16);color:var(--teal)}
#mini .msw{border:3px solid var(--frame);box-shadow:0 0 0 2px rgba(255,255,255,.18)}
#mini .msw.on{box-shadow:0 0 0 3px var(--teal)}
#mini .grip{color:var(--on-frame2);font-size:22px}
#mini .mdot{background:var(--on-frame2)}
#cornerBtn{background:rgba(19,33,74,.35);color:#fff;font-size:22px}
#toast{background:var(--frame);border:1px solid rgba(255,255,255,.08);font-size:18px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.selbar button{background:var(--frame);color:var(--on-frame);font-size:22px;display:grid;place-items:center;border-radius:12px}
dialog{border-radius:20px}
/* ================= Módulos al estilo Fori ================= */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range],input[type=checkbox]{accent-color:var(--accent)}
.btn,.seg button,.addp{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn,.seg button,.addp{line-height:1.15}
.btn .ico,.seg button .ico{font-size:20px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost:not(.on):hover{background:color-mix(in srgb,var(--ink) 9%,var(--chrome));filter:none}
.btn.tog.on:hover{filter:none}
.team .btn.ghost{background:var(--panel)}
.team .btn.ghost:hover{background:color-mix(in srgb,var(--ink) 7%,var(--panel))}
.btn.big{font-size:28px}.btn.big .ico{font-size:26px}
.btn.tdel .ico,.as-m .ico{font-size:20px}
.btn.danger{color:#fff}
.btn.tog:not(.on){color:var(--ink)}
.seg button{display:flex}
.addp{border-radius:12px;font-weight:700}
.lbl{font-weight:600}
.muted{font-weight:500}
.win>.body{padding:18px}
.win>header span{font-weight:700}

/* tipografía: pesos entre 500 y 700 */
.addp,.rang,.eurtot,.target,.res,.dig,.big,.ringnum,.pick,.tv,.mlinfo,.fr,.hc.hl,.as-big2,.as-mt,.as-now,.as-sn,.as-sb,#modeChip,.cuisb,.as-n,.as-bigday,.fr b,.pv b,.mat b,.mat span,.rrow b,.gchip,.team .tn{font-weight:700}
.dig,.big,.ringnum,.tv,.pick{letter-spacing:-.01em}

/* radios y superficies */
.pv div,.gcard,.srow,.mbtn,.as-eb,.cuisb,.as-sb,.as-wb,.as-season,.nbar{border-radius:12px}
.team{border-radius:14px;border-top-width:8px}
.gcard{border-left-width:6px}
.nbar{border-radius:999px}
.as-wb{border-width:3px}
.as-sb{border-width:3px;border-radius:14px}
.as-d{border-radius:10px}
.hc{border-width:1.5px;border-radius:9px}
.gchip{border-radius:10px;border-left-width:8px}
.numin,.din,dialog textarea,dialog select,dialog input[type=date]{border-radius:10px;border:1px solid var(--line)}
.numin{border-width:1.5px}
#trash{border-radius:18px;border:3px dashed var(--danger);color:var(--danger)}
#trash .ico{font-size:52px}
#trash.hot{color:#fff}
.note{border-radius:10px;box-shadow:0 8px 22px rgba(9,16,40,.22)}
.nh{background:rgba(0,0,0,.07);border-radius:10px 10px 0 0}
.nh button{display:grid;place-items:center;color:#2b2f36;border-radius:8px;font-size:20px}
.nh button:hover{background:rgba(0,0,0,.1)}
.nb{font-family:var(--font);font-weight:500}
.piece{filter:drop-shadow(0 2px 3px rgba(9,16,40,.22))}
.ruler{filter:drop-shadow(0 6px 10px rgba(9,16,40,.24))}
.prot{filter:drop-shadow(0 6px 10px rgba(9,16,40,.22))}

/* asas de giro y botones de la regla y el transportador */
.rrot,.prot-h{background:var(--accent);color:var(--accent-ink);font-size:24px;box-shadow:0 3px 8px rgba(9,16,40,.28)}
.prot-h.prot-x{background:var(--danger);color:#fff;font-size:22px}
.rbtns button{display:grid;place-items:center;border-radius:10px;background:rgba(0,0,0,.12);color:#2b2108}
.rbtns button:hover{background:rgba(0,0,0,.2)}
.rbtns .ico{font-size:20px}

/* fracciones */
.fp.on{fill:var(--coral)}

/* asamblea y semáforo */
.as-tabs button span{font-size:inherit}
.as-tabs button{gap:6px;font-size:16px;font-weight:600}
.as-tabs button .ico{font-size:24px}
.as-q{color:var(--muted);font-weight:600}
.as-sc .ico{font-size:110px;color:var(--muted)}
.as-wb{font-weight:600;font-size:17px}
.as-sb{font-weight:700}

/* aviso y foco */
#toast .btn{min-height:40px;padding:0 14px;font-size:16px;background:var(--teal);color:var(--frame)}
#spotCtl{border-radius:16px;border:1px solid var(--line);box-shadow:0 12px 30px rgba(9,16,40,.35);gap:8px;padding:8px}
#spotCtl .btn{min-height:48px}

/* ajustes */
dialog{box-shadow:0 24px 70px rgba(9,16,40,.4);border:1px solid var(--line)}
dialog h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
dialog h3{font-size:15px;font-weight:700;color:var(--muted);margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
dialog h2+h3{border-top:0;padding-top:0;margin-top:14px}
dialog label{font-weight:600;color:var(--ink)}
dialog code{background:var(--chrome);color:var(--ink);padding:2px 6px;border-radius:6px;font-size:.92em}
dialog textarea,dialog select,.din{background:var(--board);color:var(--ink)}
dialog::backdrop{background:rgba(9,16,40,.62)}
.inl{font-weight:500}
/* bolsa de selección, barra de ventanas minimizadas */
.selbar .wide{width:auto;padding:0 16px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;white-space:nowrap}
.selbar .wide .ico{font-size:20px}
#tray{display:none;gap:8px;align-items:center;margin-left:4px}
.dbtn.tray{min-height:48px;padding:0 14px;font-size:15px}
.dbtn.tray.on{background:var(--frame2);color:var(--on-frame);box-shadow:inset 0 0 0 2px var(--coral)}
.dbtn.tray.min{color:var(--on-frame2)}
.dbtn.tray.min{opacity:.75;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.win>header .x+.x{margin-left:-4px}
/* accesos a Lectori y Barri */
.appbtn{display:block;width:38px;height:38px;border-radius:10px;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.12);transition:transform .15s}
.appbtn img{display:block;width:100%;height:100%}
.appbtn:hover{box-shadow:0 0 0 2px var(--teal)}
.appbtn:active{transform:scale(.92)}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="mini" id="btnSettings" aria-label="Ajustes (mantener pulsado)">⚙</button>
    <span class="brand"><img src="icon-mark.svg" alt="">Fori</span><span class="brand-sep"></span>
    <span id="dateStr"></span>
    <span id="clock"></span>
    <span id="subject"></span>
    <span id="modeChip"></span>
    <span class="sp"></span>
    <button class="chip" id="clsChip"></button>
    <!-- Accesos directos a las otras apps de la familia: se abren en su propia ventana, no dentro de Fori -->
    <a class="appbtn" href="https://ilinper301-hue.github.io/Lectori/" target="_blank" rel="noopener" title="Abrir Lectori" aria-label="Abrir Lectori"><img src="apps/lectori.png" alt=""></a>
    <a class="appbtn" href="https://ilinper301-hue.github.io/barri/" target="_blank" rel="noopener" title="Abrir Barri" aria-label="Abrir Barri"><img src="apps/barri.png" alt=""></a>
    <span class="brand-sep"></span>
    <button class="mini" id="btnView" data-pop="view" aria-label="Modo de pantalla">▣</button>
    <button class="mini" id="btnFs" aria-label="Pantalla completa">⛶</button>
  </header>
  <aside id="left"></aside>
  <main id="stage">
    <div id="bgimg"></div>
    <canvas id="bg"></canvas>
    <canvas id="draw"></canvas>
    <canvas id="live"></canvas>
    <div id="floaters"><div id="manip"><div class="mat" id="mat">
      <div style="background:rgba(47,158,68,.08)"><b style="color:#2f9e44">C</b><span>Centenas</span></div>
      <div style="background:rgba(224,49,49,.08)"><b style="color:#e03131">D</b><span>Decenas</span></div>
      <div style="background:rgba(30,111,224,.08)"><b style="color:#1e6fe0">U</b><span>Unidades</span></div>
    </div></div></div>
    <div id="trash"><span class="ico" aria-hidden="true"><svg><use href="#i-trash"/></svg></span></div>
  </main>
  <aside id="right"></aside>
  <footer id="dock"></footer>
</div>

<div id="pop"></div>
<div id="mini"></div>
<button id="cornerBtn" data-pop="view" aria-label="Mostrar herramientas (mantener pulsado)">▣</button>
<div id="toast"></div>
<div id="spot"><svg width="100%" height="100%"><defs><mask id="spm"><rect width="100%" height="100%" fill="white"/><circle id="hc" fill="black"/><rect id="hr" fill="black"/></mask></defs><rect width="100%" height="100%" fill="rgba(0,0,0,.86)" mask="url(#spm)"/></svg></div>
<div id="spotCtl"></div>
<input type="file" id="bgFile" accept="image/*" hidden>

<dialog id="settings">
  <h2>Ajustes</h2>
  <h3>Clase</h3>
  <div class="row">
    <select id="sClass"></select>
    <button class="btn ghost" id="sClsNew"><span class="ico" aria-hidden="true"><svg><use href="#i-plus"/></svg></span> Nueva clase</button>
    <button class="btn ghost" id="sClsRen"><span class="ico" aria-hidden="true"><svg><use href="#i-pen"/></svg></span> Renombrar</button>
    <button class="btn ghost" id="sClsDel"><span class="ico" aria-hidden="true"><svg><use href="#i-trash"/></svg></span> Borrar</button>
  </div>
  <div class="sgrid" style="margin-top:12px">
    <div><label for="sStudents">Alumnos (uno por línea)</label><textarea id="sStudents" rows="10"></textarea></div>
    <div><label for="sRoles">Encargados / roles (uno por línea)</label><textarea id="sRoles" rows="10"></textarea></div>
  </div>
  <h3>Horario · formato <code>09:00-10:00 Lengua</code></h3>
  <div class="sched" id="sSched"></div>
  <h3>Calendario escolar</h3>

/* ============ Utilidades ============ */
let tt;
function toast(msg,action){
  const t=$('#toast');t.replaceChildren(msg);
  if(action)t.append(h('button',{class:'btn',onclick:()=>{action.fn();t.style.display='none'}},action.label));
  t.style.display='flex';clearTimeout(tt);
  tt=setTimeout(()=>t.style.display='none',action?6000:2500);
}
let actx;
function audio(){actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx}
function beep(n=3){
  try{const a=audio();for(let i=0;i<n;i++){
    const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);
    const t=a.currentTime+i*.45;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.start(t);o.stop(t+.4);
  }}catch{}
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ============ Reloj y horario ============ */
function parseLine(t){
  const m=t.match(/^(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})\s+(.+)$/);
  return m?{s:Number(m[1])*60+Number(m[2]),e:Number(m[3])*60+Number(m[4]),name:m[5],time:`${pad(m[1])}:${m[2]}–${pad(m[3])}:${m[4]}`}:{name:t,time:''};
}
const todayLines=(d=new Date())=>(S.schedule[d.getDay()]||[]).map(parseLine);
function tickClock(){
  const d=new Date(),m=d.getHours()*60+d.getMinutes();
  const ds=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  $('#dateStr').textContent=ds.charAt(0).toUpperCase()+ds.slice(1);
  $('#clock').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const cur=todayLines(d).find(x=>x.s!=null&&m>=x.s&&m<x.e);
  const sj=$('#subject');sj.style.display=cur?'inline-block':'none';if(cur)sj.textContent='Ahora: '+cur.name;
}

const inkColor=()=>document.documentElement.dataset.theme==='dark'?'#ffffff':'#111111';

/* --- Páginas y guardado automático (IndexedDB) --- */
const newPage=bgType=>({strokes:[],bg:bgType||'plain',img:null,undo:[],redo:[]});
let pages=[newPage()],cur=0,sel=null;
const P=()=>pages[cur];
const DB={db:null,
  open(){return new Promise(r=>{try{const q=indexedDB.open('fori',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r()}catch{r()}})},
  get(k){return new Promise(r=>{if(!this.db)return r(null);try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result??null);q.onerror=()=>r(null)}catch{r(null)}})},
  set(k,v){return new Promise(r=>{if(!this.db)return r(false);try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false)}catch{r(false)}})}
};
let persistT=null;
function persist(){
  clearTimeout(persistT);
  persistT=setTimeout(()=>DB.set('board',{cur,pages:pages.map(p=>({strokes:p.strokes,bg:p.bg,img:p.img}))}),600);
}
async function loadBoard(){
  await DB.open();
  const d=await DB.get('board');
  if(d&&Array.isArray(d.pages)&&d.pages.length){
    pages=d.pages.map(p=>({strokes:p.strokes||[],bg:p.bg||'plain',img:p.img||null,undo:[],redo:[]}));
    cur=clamp(d.cur|0,0,pages.length-1);
  }
  showPage();
}

/* --- Fondos y pautas --- */
function fit(){
  const dpr=window.devicePixelRatio||1,w=stage.clientWidth,hh=stage.clientHeight;
  for(const [c,x] of [[bg,cb],[dr,cd],[lv,cl]]){c.width=Math.round(w*dpr);c.height=Math.round(hh*dpr);x.setTransform(dpr,0,0,dpr,0,0)}
  drawBg();redraw();
}
function paintBg(ctx,w,hh,type,dark){
  const k=S.pautaSize||1;
  const soft=dark?'rgba(255,255,255,.22)':'rgba(30,80,160,.28)';
  const strong=dark?'rgba(255,255,255,.5)':'rgba(30,80,160,.6)';
  const red=dark?'rgba(255,120,120,.6)':'rgba(214,40,40,.55)';
  const line=(y,c,wd,dash)=>{ctx.beginPath();ctx.setLineDash(dash||[]);ctx.strokeStyle=c;ctx.lineWidth=wd||1.5;ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()};
  ctx.save();ctx.lineWidth=1.5;ctx.strokeStyle=soft;ctx.fillStyle=soft;
  if(type==='grid'){
    const c=40*k;
    for(let x=0;x<w;x+=c){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,hh);ctx.stroke()}
    for(let y=0;y<hh;y+=c)line(y,soft);
  }else if(type==='dots'){
    const c=40*k;
    for(let x=c/2;x<w;x+=c)for(let y=c/2;y<hh;y+=c){ctx.beginPath();ctx.arc(x,y,2.4,0,7);ctx.fill()}
  }else if(type==='lines'){ // pauta de doble línea con línea intermedia discontinua
    for(let y=0;y<hh;y+=130*k){line(y+18*k,soft);line(y+38*k,strong);line(y+63*k,soft,1.5,[8,8]);line(y+88*k,strong);line(y+108*k,soft)}
  }else if(type==='montessori'){ // 4 líneas: ascendentes · cuerpo (sombreado) · descendentes
    const s=32*k;
    for(let y=0;y<hh;y+=s*5){
      ctx.fillStyle=dark?'rgba(255,120,120,.10)':'rgba(214,40,40,.07)';ctx.fillRect(0,y+s*1.5,w,s);
      line(y+s*.5,strong);line(y+s*1.5,red,2);line(y+s*2.5,red,2);line(y+s*3.5,strong);
    }
  }else if(type==='cuadrovia'){ // cuadrícula en grupos de 3 filas con la fila central (cuerpo) marcada
    const c=22*k;
    for(let x=0;x<w;x+=c){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,hh);ctx.stroke()}
    for(let r=0;r*c<hh;r++)line(r*c,soft,1);
    for(let y=0;y<hh;y+=c*3){
      ctx.fillStyle=dark?'rgba(120,180,255,.10)':'rgba(30,111,224,.07)';ctx.fillRect(0,y+c,w,c);
      line(y+c,strong,2.2);line(y+2*c,strong,2.2);
    }
  }
  ctx.restore();
}
function drawBg(){
  const w=stage.clientWidth,hh=stage.clientHeight;
  cb.clearRect(0,0,w,hh);
  paintBg(cb,w,hh,P().bg,document.documentElement.dataset.theme==='dark');
  $('#bgimg').style.backgroundImage=P().img?`url(${P().img})`:'';
}

/* --- Dibujo de trazos, formas y textos --- */
function setStyle(ctx,s){
  ctx.lineCap=ctx.lineJoin='round';ctx.lineWidth=s.size;
  ctx.globalAlpha=s.tool==='marker'?.35:1;
  if(s.tool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.strokeStyle=ctx.fillStyle='#000'}
  else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=ctx.fillStyle=s.color==='ink'?inkColor():s.color}
}
function seg(ctx,s,p0,p1){
  ctx.save();setStyle(ctx,s);ctx.beginPath();
  if(p0===p1||(p0.x===p1.x&&p0.y===p1.y)){ctx.arc(p0.x,p0.y,s.size/2,0,7);ctx.fill()}
  else{ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke()}
  ctx.restore();
}
function polygon(ctx,n,cx,cy,rx,ry){
  ctx.beginPath();
  for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;const x=cx+rx*Math.cos(a),y=cy+ry*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  ctx.closePath();
}
function shapeEnd(s){ // cuadrado, círculo y polígonos regulares se mantienen proporcionados
  const a=s.a,b=s.b;
  if(!['square','circle','pentagon','hexagon'].includes(s.shape))return b;
  const dx=b.x-a.x,dy=b.y-a.y,m=Math.max(Math.abs(dx),Math.abs(dy));
  return{x:a.x+(dx<0?-m:m),y:a.y+(dy<0?-m:m)};
}
function drawShape(ctx,s){
  const a=s.a,b=shapeEnd(s);
  const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(b.x-a.x),hh=Math.abs(b.y-a.y),cx=x+w/2,cy=y+hh/2;
  ctx.save();setStyle(ctx,s);ctx.beginPath();
  switch(s.shape){
    case 'line':ctx.moveTo(a.x,a.y);ctx.lineTo(s.b.x,s.b.y);break;
    case 'rect':case 'square':ctx.rect(x,y,w,hh);break;
    case 'circle':case 'ellipse':ctx.ellipse(cx,cy,w/2,hh/2,0,0,7);break;
    case 'triangle':ctx.moveTo(cx,y);ctx.lineTo(x+w,y+hh);ctx.lineTo(x,y+hh);ctx.closePath();break;
    case 'pentagon':polygon(ctx,5,cx,cy,w/2,hh/2);break;
    case 'hexagon':polygon(ctx,6,cx,cy,w/2,hh/2);break;
  }
  if(s.fill&&s.shape!=='line'){ctx.save();ctx.globalAlpha=.3;ctx.fill();ctx.restore()}
  ctx.stroke();ctx.restore();
}
function drawText(ctx,s){
  ctx.save();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=s.color==='ink'?inkColor():s.color;ctx.font=`600 ${s.fs}px ${FONT}`;ctx.textBaseline='top';
  s.text.split('\n').forEach((l,i)=>ctx.fillText(l,s.x,s.y+s.fs*.1+i*s.fs*1.2));
  ctx.restore();
}
function drawStroke(ctx,s){
  if(s.type==='text')return drawText(ctx,s);
  if(s.type==='shape')return drawShape(ctx,s);
  if(s.pts.length===1)return seg(ctx,s,s.pts[0],s.pts[0]);
  ctx.save();setStyle(ctx,s);ctx.beginPath();
  s.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.stroke();ctx.restore();
}
function redraw(){cd.clearRect(0,0,stage.clientWidth,stage.clientHeight);P().strokes.forEach(s=>drawStroke(cd,s))}
const pt=e=>{const r=dr.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};

/* --- Selección: caja envolvente y detección de toque --- */
function bbox(s){
  if(s.type==='text'){
    cl.save();cl.font=`600 ${s.fs}px ${FONT}`;
    const w=Math.max(20,...s.text.split('\n').map(l=>cl.measureText(l).width));cl.restore();
    return{x:s.x,y:s.y,w,h:s.text.split('\n').length*s.fs*1.2};
  }
  const ps=s.type==='shape'?[s.a,shapeEnd(s)]:s.pts,m=s.size/2;
  const xs=ps.map(p=>p.x),ys=ps.map(p=>p.y),x=Math.min(...xs)-m,y=Math.min(...ys)-m;
  return{x,y,w:Math.max(...xs)+m-x,h:Math.max(...ys)+m-y};
}
const distSeg=(p,a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy,t=l?clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l,0,1):0;return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)};
function hitTest(p){
  const st=P().strokes;
  for(let i=st.length-1;i>=0;i--){
    const s=st[i];if(s.tool==='eraser')continue;
    const b=bbox(s),pad=14;
    if(p.x<b.x-pad||p.x>b.x+b.w+pad||p.y<b.y-pad||p.y>b.y+b.h+pad)continue;
    if(s.type==='free'){const tol=s.size/2+pad;if(s.pts.length===1?Math.hypot(p.x-s.pts[0].x,p.y-s.pts[0].y)<tol:s.pts.some((q,j)=>j&&distSeg(p,s.pts[j-1],q)<tol))return s;continue}
    if(s.type==='shape'&&s.shape==='line'){if(distSeg(p,s.a,s.b)<s.size/2+pad)return s;continue}
    return s;
  }
  return null;
}
function translate(s,dx,dy){
  if(s.type==='text'){s.x+=dx;s.y+=dy}
  else if(s.type==='shape'){s.a={x:s.a.x+dx,y:s.a.y+dy};s.b={x:s.b.x+dx,y:s.b.y+dy}}
  else s.pts.forEach(p=>{p.x+=dx;p.y+=dy});
}

/* --- Historial por página: deshacer / rehacer --- */
function applyOp(op,rev){
  const st=P().strokes;
  switch(op.t){
    case 'add':if(!rev)st.push(op.s);else{const i=st.lastIndexOf(op.s);if(i>=0)st.splice(i,1)}break;
    case 'del':if(!rev)st.splice(st.indexOf(op.s),1);else st.splice(Math.min(op.i,st.length),0,op.s);break;
    case 'move':translate(op.s,rev?-op.dx:op.dx,rev?-op.dy:op.dy);break;
    case 'rep':{const i=st.indexOf(rev?op.b:op.a);if(i>=0)st[i]=rev?op.a:op.b;break}
    case 'clear':P().strokes=rev?op.backup:[];break;
    case 'multi':(rev?[...op.ops].reverse():op.ops).forEach(o=>applyOp(o,rev));break;
  }
}
function record(op){P().undo.push(op);if(P().undo.length>200)P().undo.shift();P().redo.length=0;changed()}
function doOp(op){applyOp(op,false);record(op)}
function changed(){redraw();drawLive();persist();updatePageUI()}
function undo(){commitEditor();const op=P().undo.pop();if(!op)return;applyOp(op,true);P().redo.push(op);setSel(null);changed()}
function redo(){commitEditor();const op=P().redo.pop();if(!op)return;applyOp(op,false);P().undo.push(op);setSel(null);changed()}
function clearBoard(){
  commitEditor();setSel(null);
  if(!P().strokes.length)return;
  doOp({t:'clear',backup:P().strokes});
  toast('Página limpiada',{label:ib('undo','Deshacer'),fn:undo});
}

/* --- Vista previa (capa #live): formas, fluorescente y selección --- */
const previewed=s=>s.type==='shape'||s.tool==='marker';
function drawLive(){
  cl.clearRect(0,0,stage.clientWidth,stage.clientHeight);
  for(const s of active.values())if(s.type&&previewed(s))drawStroke(cl,s);
  const b=selBox();
  if(b){cl.save();cl.setLineDash([10,8]);cl.lineWidth=3;cl.strokeStyle='#27C1B0';cl.strokeRect(b.x-8,b.y-8,b.w+16,b.h+16);cl.restore()}
  for(const a of active.values())if(a.lasso&&a.lasso.length>1){ // la bolsa mientras se dibuja
    cl.save();cl.beginPath();a.lasso.forEach((q,i)=>i?cl.lineTo(q.x,q.y):cl.moveTo(q.x,q.y));cl.closePath();
    cl.fillStyle='rgba(39,193,176,.12)';cl.fill();cl.setLineDash([12,8]);cl.lineWidth=3;cl.strokeStyle='#27C1B0';cl.stroke();cl.restore();
  }
}
const selbar=h('div',{class:'selbar'});
stage.append(selbar);
/* --- Selección: un elemento (sel) o un grupo rodeado con la bolsa (grp: trazos + piezas) --- */
let grp=null;
function grpBox(){
  if(!grp)return null;
  const bs=[...grp.strokes.map(bbox),...grp.pieces.filter(p=>p.isConnected).map(p=>({x:p.offsetLeft,y:p.offsetTop,w:p.offsetWidth,h:p.offsetHeight}))];
  if(!bs.length)return null;
  const x=Math.min(...bs.map(b=>b.x)),y=Math.min(...bs.map(b=>b.y));
  return{x,y,w:Math.max(...bs.map(b=>b.x+b.w))-x,h:Math.max(...bs.map(b=>b.y+b.h))-y};
}
const selBox=()=>sel?bbox(sel):grpBox();
function setSel(s){sel=s;grp=null;drawLive();placeSelbar()}
function setGrp(g){grp=g&&(g.strokes.length||g.pieces.length)?g:null;sel=null;drawLive();placeSelbar()}
function deleteSelection(){
  if(sel){const s=sel;setSel(null);doOp({t:'del',s,i:P().strokes.indexOf(s)});return}
  if(!grp)return;
  const g=grp;setSel(null);
  g.pieces.forEach(p=>p.remove());updateCounts();
  if(g.strokes.length)doOp({t:'multi',ops:g.strokes.map(s=>({t:'del',s,i:P().strokes.indexOf(s)}))});
}
function placeSelbar(){
  const b=selBox();
  if(!b){selbar.style.display='none';return}
  const btns=[];
  if(sel)btns.push(h('button',{'aria-label':'Duplicar',onclick:()=>{const c=structuredClone(sel);translate(c,30,30);doOp({t:'add',s:c});setSel(c)}},ico('copy')));
  if(grp){
    const u=grp.pieces.filter(p=>p.dataset.k==='u').length,t=grp.pieces.filter(p=>p.dataset.k==='t').length;
    if(u>=10||t>=10)btns.push(h('button',{class:'wide',onclick:groupSelected},...ib('magnet',u>=10?'Agrupar en decenas':'Agrupar en centenas')));
  }
  btns.push(h('button',{'aria-label':'Borrar',onclick:deleteSelection},ico('trash')));
  selbar.replaceChildren(...btns);selbar.style.display='flex';
  selbar.style.left=clamp(b.x+b.w-selbar.offsetWidth+8,4,stage.clientWidth-selbar.offsetWidth-4)+'px';
  selbar.style.top=(b.y-72<4?b.y+b.h+16:b.y-72)+'px';
}
// ¿Está el punto dentro del polígono de la bolsa?
function inPoly(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)c=!c}return c}
function lassoSelect(poly){
  if(poly.length<3)return;
  const strokes=P().strokes.filter(s=>{
    if(s.tool==='eraser')return false;
    if(s.type==='free'){const n=s.pts.filter(q=>inPoly(q,poly)).length;return n>=s.pts.length*.6}
    const b=bbox(s);return inPoly({x:b.x+b.w/2,y:b.y+b.h/2},poly);
  });
  const pcs=$$('.piece',manip).filter(el=>inPoly({x:el.offsetLeft+el.offsetWidth/2,y:el.offsetTop+el.offsetHeight/2},poly));
  // Base 10: si se rodean exactamente 10 unidades (o 10 decenas) y nada más, se agrupan solas
  const ks=pcs.map(p=>p.dataset.k);
  if(!strokes.length&&pcs.length===10&&(ks.every(k=>k==='u')||ks.every(k=>k==='t'))){mergePieces(pcs,ks[0]==='u'?'t':'h');setSel(null);return}
  setGrp({strokes,pieces:pcs});
}
// Junta 10 piezas en el centro y las cambia por una pieza mayor (con animación)
function mergePieces(list,big){
  const cx=list.reduce((a,p)=>a+p.offsetLeft+p.offsetWidth/2,0)/list.length,cy=list.reduce((a,p)=>a+p.offsetTop+p.offsetHeight/2,0)/list.length;
  list.forEach(p=>{p.classList.add('anim');p.style.left=(cx-p.offsetWidth/2)+'px';p.style.top=(cy-p.offsetHeight/2)+'px'});
  setTimeout(()=>{
    list.forEach(p=>p.remove());const K=KINDS[big],q=b10Slot(big,pieces(big).length),el=addPiece(big,cx-K.w/2,cy-K.h/2);
    // la pieza nueva se va a su columna
    requestAnimationFrame(()=>{el.classList.add('anim');el.style.left=q.x+'px';el.style.top=q.y+'px';setTimeout(()=>el.classList.remove('anim'),400)});
    toast(big==='t'?'10 unidades = 1 decena':'10 decenas = 1 centena');
  },380);
}
function groupSelected(){
  if(!grp)return;
  const g=grp;setSel(null);
  for(const [small,big] of [['u','t'],['t','h']]){
    const list=g.pieces.filter(p=>p.dataset.k===small&&p.isConnected);
    for(let i=0;i+10<=list.length;i+=10)mergePieces(list.slice(i,i+10),big);
  }
}

/* --- Herramienta de texto --- */
let editor=null;
function sizeEditor(){
  if(!editor)return;const ta=editor.ta;
  cl.save();cl.font=`600 ${editor.fs}px ${FONT}`;
  const w=Math.max(...ta.value.split('\n').map(l=>cl.measureText(l).width));cl.restore();
  ta.style.width=Math.max(editor.fs*4,w+editor.fs)+'px';
  ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';
}
function openEditor(x,y,orig){
  commitEditor();setSel(null);
  const fs=orig?orig.fs:FS[T.size],color=orig?orig.color:T.color;
  const ta=h('textarea',{class:'txted',spellcheck:'false',rows:'1'});
  ta.style.cssText=`left:${x-3}px;top:${y-3}px;font-size:${fs}px;color:${cssColor(color)}`;
  let idx=-1;
  if(orig){idx=P().strokes.indexOf(orig);P().strokes.splice(idx,1);redraw();ta.value=orig.text}
  stage.append(ta);
  editor={ta,x,y,fs,color,orig,idx};
  ta.addEventListener('input',sizeEditor);
  ta.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();commitEditor()}});
  sizeEditor();ta.focus();
}
function commitEditor(){
  if(!editor)return;
  const e=editor;editor=null;
  const text=e.ta.value.replace(/\s+$/,'');e.ta.remove();
  const st=P().strokes;
  if(e.orig){
    if(!text)record({t:'del',s:e.orig,i:e.idx});
    else if(text===e.orig.text){st.splice(e.idx,0,e.orig);changed()}
    else{const ns={...e.orig,text};st.splice(e.idx,0,ns);record({t:'rep',a:e.orig,b:ns})}
  }else if(text)doOp({t:'add',s:{type:'text',x:e.x,y:e.y,text,fs:e.fs,color:e.color}});
}

/* --- Entrada táctil / lápiz / ratón sobre el lienzo --- */
let pensDown=0;
dr.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(e.pointerType==='touch'&&pensDown)return; // rechazo de palma: con un lápiz apoyado se ignora el dedo
  closePop();
  const p=pt(e);
  if(T.tool==='text'){
    e.preventDefault();
    if(editor){commitEditor();return}
    const hit=hitTest(p);
    if(hit&&hit.type==='text')openEditor(hit.x,hit.y,hit);else openEditor(p.x,p.y-FS[T.size]*.6);
    return;
  }
  commitEditor();
  if(e.pointerType==='pen')pensDown++;
  dr.setPointerCapture(e.pointerId);
  const isPen=e.pointerType==='pen';
  const gb=grp&&grpBox();
  if(gb&&p.x>=gb.x-14&&p.x<=gb.x+gb.w+14&&p.y>=gb.y-14&&p.y<=gb.y+gb.h+14){ // arrastrar el grupo
    active.set(e.pointerId,{grpDrag:true,last:p,dx:0,dy:0,pen:isPen});return;
  }
  if(T.tool==='select'){
    const s=hitTest(p);
    if(s){setSel(s);active.set(e.pointerId,{sel:s,last:p,dx:0,dy:0,pen:isPen});return}
    setSel(null);active.set(e.pointerId,{lasso:[p],pen:isPen});return; // en vacío: dibujar la bolsa
  }
  setSel(null);
  let s;
  if(T.tool==='shape')s={type:'shape',shape:T.shape,fill:T.fill,color:T.color,size:T.size,a:p,b:p};
  else{
    const size=T.tool==='eraser'?Math.max(30,T.size*5):T.tool==='marker'?T.size*4+10:T.size;
    s={type:'free',tool:T.tool,color:T.color,size,pts:[p]};
    if(!previewed(s))seg(cd,s,p,p);
  }
  s.pen=e.pointerType==='pen';
  active.set(e.pointerId,s);drawLive();
  // mantener pulsado sin mover: se convierte en bolsa de selección
  if(T.tool!=='eraser'){
    const id=e.pointerId,start=p;
    s.lp=setTimeout(()=>{
      if(active.get(id)!==s||s.moved)return;
      active.set(id,{lasso:[start],pen:s.pen});redraw();drawLive();
      try{navigator.vibrate&&navigator.vibrate(15)}catch{}
      toast('Rodea los elementos para seleccionarlos');
    },550);
  }
});
dr.addEventListener('pointermove',e=>{
  const s=active.get(e.pointerId);if(!s)return;
  if(s.lasso){const q=pt(e),l=s.lasso[s.lasso.length-1];if(Math.hypot(q.x-l.x,q.y-l.y)>4){s.lasso.push(q);drawLive()}return}
  if(s.grpDrag){
    const q=pt(e),dx=q.x-s.last.x,dy=q.y-s.last.y;s.last=q;s.dx+=dx;s.dy+=dy;
    grp.strokes.forEach(t=>translate(t,dx,dy));
    grp.pieces.forEach(el=>{el.style.left=(el.offsetLeft+dx)+'px';el.style.top=(el.offsetTop+dy)+'px'});
    redraw();drawLive();placeSelbar();return;
  }
  if(s.lp&&!s.moved){const q=pt(e),o=s.pts?s.pts[0]:s.a;if(Math.hypot(q.x-o.x,q.y-o.y)>10)s.moved=true}
  if(s.sel!==undefined){ // arrastrando una selección
    if(!s.sel)return;const p=pt(e),dx=p.x-s.last.x,dy=p.y-s.last.y;
    translate(s.sel,dx,dy);s.dx+=dx;s.dy+=dy;s.last=p;redraw();setSel(s.sel);return;
  }
  if(s.type==='shape'){s.b=pt(e);drawLive();return}
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of (evs.length?evs:[e])){const p=pt(ev),last=s.pts[s.pts.length-1];s.pts.push(p);if(!previewed(s))seg(cd,s,last,p)}
  if(previewed(s))drawLive();
});
function endStroke(e){
  const s=active.get(e.pointerId);if(!s)return;active.delete(e.pointerId);
  if(s.pen)pensDown=Math.max(0,pensDown-1);
  if(s.lp)clearTimeout(s.lp);
  if(s.lasso){lassoSelect(s.lasso);drawLive();return}
  if(s.grpDrag){if(grp&&grp.strokes.length&&(s.dx||s.dy))record({t:'multi',ops:grp.strokes.map(t=>({t:'move',s:t,dx:s.dx,dy:s.dy}))});placeSelbar();return}
  if(s.sel!==undefined){if(s.sel&&(s.dx||s.dy))record({t:'move',s:s.sel,dx:s.dx,dy:s.dy});return}
  delete s.pen;delete s.lp;delete s.moved;
  if(s.type==='shape'&&s.a.x===s.b.x&&s.a.y===s.b.y){drawLive();return}
  P().strokes.push(s);
  if(previewed(s))drawStroke(cd,s);
  record({t:'add',s});
}
dr.addEventListener('pointerup',endStroke);
dr.addEventListener('pointercancel',endStroke);
document.addEventListener('keydown',e=>{
  if(e.target.closest('textarea,input,[contenteditable]'))return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo()}

/* --- Exportar: imagen PNG de la página o PDF de todas (vía imprimir) --- */
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
async function renderPage(p,scale=2){
  const w=stage.clientWidth,hh=stage.clientHeight,dark=document.documentElement.dataset.theme==='dark';
  const c=document.createElement('canvas');c.width=w*scale;c.height=hh*scale;
  const x=c.getContext('2d');x.scale(scale,scale);
  x.fillStyle=getComputedStyle(stage).backgroundColor;x.fillRect(0,0,w,hh);
  if(p.img){const im=await loadImg(p.img);if(im){const k=Math.min(w/im.width,hh/im.height);x.drawImage(im,(w-im.width*k)/2,(hh-im.height*k)/2,im.width*k,im.height*k)}}
  paintBg(x,w,hh,p.bg,dark);
  const ink=document.createElement('canvas');ink.width=c.width;ink.height=c.height; // capa aparte para que el borrador no borre el fondo
  const ix=ink.getContext('2d');ix.scale(scale,scale);p.strokes.forEach(s=>drawStroke(ix,s));
  x.setTransform(1,0,0,1,0,0);x.drawImage(ink,0,0);
  return c;
}
async function exportPNG(){
  commitEditor();
  const c=await renderPage(P());
  c.toBlob(b=>{const a=h('a',{href:URL.createObjectURL(b),download:`fori-pagina-${cur+1}.png`});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)});
}
async function exportPDF(){

  fr.srcdoc=`<!doctype html><html><head><title>Fori</title><style>@page{size:A4 landscape;margin:8mm}body{margin:0}img{display:block;width:100%;height:calc(100vh - 2px);object-fit:contain;break-after:page}img:last-child{break-after:auto}</style></head><body>${imgs.map(s=>`<img src="${s}">`).join('')}</body></html>`;

const floaters=$('#floaters'),wins=new Map();let zTop=10;

function refreshRail(){if(typeof renderTray==='function')setTimeout(renderTray);$$('[data-win]').forEach(b=>{const id=b.dataset.win;b.classList.toggle('on',wins.has(id)||(id==='spot'&&sp.on))})}
function openWin(id,title,build,w=400){

/* ============ Módulo: temporizador / cronómetro ============ */
function mTimer(body){
  let mode='down',total=300000,ms=total,run=false,last=0,iv=null;
  const C=2*Math.PI*90;
  const num=h('div',{class:'ringnum'});
  const box=h('div',{class:'ringbox',html:`<svg viewBox="0 0 200 200" width="260" height="260"><circle cx="100" cy="100" r="90" fill="none" stroke="var(--line)" stroke-width="14"/><circle class="fg" cx="100" cy="100" r="90" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>`},num);
  const fg=$('.fg',box);
  const go=h('button',{class:'btn',style:'min-width:150px',onclick:startPause},...ib('play','Iniciar'));
  const presets=h('div',{class:'row c'},
    [1,2,5,10,15].map(m=>h('button',{class:'btn ghost',onclick:()=>{stop();total=m*60000;ms=total;draw()}},m+' min')),
    h('button',{class:'btn ghost',onclick:()=>{stop();total=Math.max(60000,total-60000);ms=total;draw()}},'−1'),
    h('button',{class:'btn ghost',onclick:()=>{stop();total+=60000;ms=total;draw()}},'+1'));
  const seg=h('div',{class:'seg'},
    h('button',{class:'on',onclick:e=>setMode('down',e.currentTarget)},...ib('hourglass','Cuenta atrás')),
    h('button',{onclick:e=>setMode('up',e.currentTarget)},...ib('timer','Cronómetro')));
  body.append(seg,box,h('div',{class:'row c'},go,h('button',{class:'btn ghost',onclick:()=>{stop();ms=mode==='down'?total:0;draw()}},...ib('reset','Reiniciar'))),h('div',{style:'height:10px'}),presets);
  function setMode(m,btn){stop();mode=m;ms=m==='down'?total:0;$$('button',seg).forEach(b=>b.classList.toggle('on',b===btn));presets.style.display=m==='down'?'flex':'none';draw()}
  function draw(){
    const s=mode==='down'?Math.ceil(ms/1000):Math.floor(ms/1000);
    num.textContent=`${pad(Math.floor(s/60))}:${pad(s%60)}`;num.classList.remove('done');
    const f=mode==='down'?(total?ms/total:0):(ms%60000)/60000;
    fg.style.strokeDashoffset=C*(1-f);fg.style.stroke=mode==='down'&&f<.15?'var(--danger)':'var(--accent)';
  }
  function tick(){
    const now=performance.now(),dt=now-last;last=now;
    if(mode==='down'){ms=Math.max(0,ms-dt);if(ms===0){stop();draw();num.classList.add('done');beep();return}}else ms+=dt;
    draw();
  }
  function stop(){run=false;clearInterval(iv);go.replaceChildren(...ib('play','Iniciar'))}
  function startPause(){
    if(run){stop();return}
    audio();if(mode==='down'&&ms<=0)ms=total;
    run=true;last=performance.now();iv=setInterval(tick,100);go.replaceChildren(...ib('pause','Pausa'));
  }
  draw();
  return()=>clearInterval(iv);
}

/* ============ Módulo: medidor de ruido ============ */
function mNoise(body){
  let ctx,stream,raf,an,buf,sm=0,dead=false;
  const val=h('div',{class:'big'},'—');
  const fill=h('i');const bar=h('div',{class:'nbar'},fill);
  const msg=h('div',{class:'muted'},'Activando micrófono…');
  const th=h('input',{type:'range',min:20,max:95,value:S.noiseMax,oninput:e=>{S.noiseMax=Number(e.target.value);save()}});
  body.append(val,bar,msg,h('label',{class:'muted',style:'display:block;margin-top:14px'},'Límite de ruido aceptable'),th,
    h('div',{class:'muted',style:'font-size:14px;margin-top:6px'},'Escala relativa de 0 a 100 (no son decibelios calibrados).'));
  (async()=>{
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      if(dead){stream.getTracks().forEach(t=>t.stop());return}
      ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();
      an=ctx.createAnalyser();an.fftSize=1024;buf=new Float32Array(an.fftSize);ctx.createMediaStreamSource(stream).connect(an);loop();
    }catch{msg.textContent='No se pudo acceder al micrófono. Revisa el permiso del navegador.'}
  })();
  function loop(){
    an.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;
    const db=20*Math.log10(Math.sqrt(s/buf.length)||1e-6),lvl=clamp((db+70)*100/60,0,100);
    sm=sm*.85+lvl*.15;val.textContent=Math.round(sm);fill.style.width=sm+'%';
    const over=sm>S.noiseMax,warn=sm>S.noiseMax*.75;
    fill.style.background=over?'var(--danger)':warn?'#f08c00':'#2f9e44';
    msg.textContent=over?'¡Demasiado ruido!':warn?'Cuidado con el volumen':'Nivel perfecto';
    raf=requestAnimationFrame(loop);
  }
  return()=>{dead=true;cancelAnimationFrame(raf);stream&&stream.getTracks().forEach(t=>t.stop());ctx&&ctx.close()};
}

function addPiece(k,x,y){
  const p=KINDS[k],el=h('div',{class:'piece',html:p.svg});el.dataset.k=k;el.dataset.g=p.g;
  el.style.left=clamp(x,0,stage.clientWidth-p.w)+'px';el.style.top=clamp(y,0,stage.clientHeight-p.h)+'px';
  manip.append(el);
  let d=null,lastTap=0;
  el.addEventListener('pointerdown',e=>{
    if(manip.lastElementChild!==el)manip.append(el);el.setPointerCapture(e.pointerId);
    d={dx:e.clientX-el.offsetLeft,dy:e.clientY-el.offsetTop,x0:e.clientX,y0:e.clientY,moved:false};
  });
  el.addEventListener('pointermove',e=>{
    if(!d)return;
    if(!d.moved&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)>6){d.moved=true;el.classList.add('drag');if(!p.tan)trash.style.display='grid'}
    if(!d.moved)return;
    el.style.left=clamp(e.clientX-d.dx,-p.w/2,stage.clientWidth-p.w/2)+'px';
    el.style.top=clamp(e.clientY-d.dy,-p.h/2,stage.clientHeight-p.h/2)+'px';
    trash.classList.toggle('hot',overTrash(e));
  });
  const end=(e,ok)=>{
    if(!d)return;const moved=d.moved;d=null;
    const hit=ok&&moved&&!p.tan&&overTrash(e);
    el.classList.remove('drag');trash.style.display='none';trash.classList.remove('hot');
    if(hit){el.remove();updateCounts();return}
    if(ok&&!moved){const now=Date.now();if(now-lastTap<400){lastTap=0;if(p.rot)rotatePiece(el);else if(p.tan)tanRotate(el);else breakPiece(el)}else lastTap=now}
  };
  el.addEventListener('pointerup',e=>end(e,true));
  el.addEventListener('pointercancel',e=>end(e,false));
  updateCounts();return el;
}
function addNew(k){
  if(B10[k]){const q=b10Slot(k,pieces(k).length);addPiece(k,q.x,q.y);return}
  const p=KINDS[k],j=(addN++%8)*18;addPiece(k,stage.clientWidth*.55-p.w/2+j,stage.clientHeight*.4-p.h/2+j);
}
// Posición de la pieza n.º i de cada tipo: centenas apiladas en montones de 10, decenas en filas de 10, unidades en filas de 10.
// Empieza por debajo de las letras C, D, U del tablero.
function b10Slot(k,i){
  const W=stage.clientWidth,cw=W/3,top=96;
  if(k==='h'){
    const st=12,pw=U*10+9*st,ph=U*10+9*st+24,pile=Math.floor(i/10),j=i%10;
    const per=Math.max(1,Math.floor((cw-20)/(pw+20))),col=pile%per,row=Math.floor(pile/per);
    const x0=Math.max(10,(cw-per*(pw+20)+20)/2);
    return{x:x0+col*(pw+20)+j*st,y:top+row*ph+j*st};
  }
  if(k==='t'){const sx=U+8,row=Math.floor(i/10);return{x:cw+Math.max(10,(cw-10*sx)/2)+(i%10)*sx,y:top+row*(U*10+16)}}
  const sx=U+6,row=Math.floor(i/10);return{x:2*cw+Math.max(10,(cw-10*sx)/2)+(i%10)*sx,y:top+row*sx};
}
// Doble toque: una centena → 10 decenas; una decena → 10 unidades; dinero → cambio en piezas menores
function breakPiece(el){
  const k=el.dataset.k;
  if(CHANGE[k]){
    const x=el.offsetLeft,y=el.offsetTop;el.remove();
    CHANGE[k].forEach((n,i)=>addPiece(n,x+i*(KINDS[n].w*.55+10),y+i*12));return;
  }
  if(k!=='h'&&k!=='t')return;
  const x=el.offsetLeft,y=el.offsetTop;el.remove();
  for(let i=0;i<10;i++){
    if(k==='h')addPiece('t',x+i*(U+4),y);
    else addPiece('u',x+(i%2)*(U+6),y+Math.floor(i/2)*(U+6));
  }
}
function regroup(){
  let changed=false;
  for(const [small,big] of [['u','t'],['t','h']]){
    const list=pieces(small);
    while(list.length>=10){
      const g=list.splice(0,10),x=g[0].offsetLeft,y=g[0].offsetTop;
      g.forEach(p=>p.remove());addPiece(big,x,y);changed=true;
    }
  }
  if(!changed)toast('Hacen falta 10 piezas iguales para agrupar');
  updateB10();
}
function arrange(){
  ['h','t','u'].forEach(k=>pieces(k).forEach((p,i)=>{const q=b10Slot(k,i);p.classList.add('anim');p.style.left=q.x+'px';p.style.top=q.y+'px';manip.append(p)}));
  setTimeout(()=>pieces().forEach(p=>p.classList.remove('anim')),400);
}
function makeNumber(v){
  const n=clamp(Math.floor(Number(v))||0,0,999);
  pieces().forEach(p=>p.remove());
  const counts={h:Math.floor(n/100),t:Math.floor(n/10)%10,u:n%10};
  for(const k in counts)for(let i=0;i<counts[k];i++)addPiece(k,0,0);
  arrange();updateB10();
}
function updateB10(){
  if(!b10ui)return;
  const c=pieces('h').length,d=pieces('t').length,u=pieces('u').length;
  b10ui.c.textContent=c;b10ui.d.textContent=d;b10ui.u.textContent=u;
  b10ui.tot.textContent=b10ui.show?String(c*100+d*10+u):'?';
}
function b10Clear(){pieces().forEach(p=>p.remove());mat.classList.remove('on');updateB10()}
function mB10(body){
  const cell=(lbl,col)=>{const b=h('b',{style:`color:${col}`},'0');return [h('div',{},b,h('span',{},lbl)),b]};
  const [cc,c]=cell('Centenas','#2f9e44'),[dd,d]=cell('Decenas','#e03131'),[uu,u]=cell('Unidades','#1e6fe0');
  const tot=h('b',{},'0');

  const vis=h('button',{class:'btn ghost tog on',onclick:()=>{b10ui.show=!b10ui.show;vis.classList.toggle('on',b10ui.show);updateB10()}},...ib('eye','Total'));
  const matB=h('button',{class:'btn ghost tog'+(mat.classList.contains('on')?' on':''),onclick:()=>matB.classList.toggle('on',mat.classList.toggle('on'))},...ib('view','Tablero'));

  body.append(

    h('div',{class:'pv'},cc,dd,uu,h('div',{class:'tot'},tot,h('span',{},'Total'))),
    h('div',{class:'row c'},vis,matB,

      h('button',{class:'btn ghost',onclick:arrange},...ib('sort','Ordenar')),

    h('div',{class:'row c',style:'margin-top:12px'},num,h('button',{class:'btn',onclick:()=>makeNumber(num.value)},'Representar número')),
    h('p',{class:'muted',style:'font-size:16px;margin:12px 0 0'},'Arrastra las piezas por la pizarra · Toca dos veces una pieza para desagruparla · Llévala a la papelera para quitarla'));
  updateB10();
