/* ============ Reloj analógico y digital ============ */
const HW=['doce','una','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce'];
const MW=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
function timeWords(t){
  const hh=Math.floor(t/60),m=t%60,next=m>30,hn=(hh+(next?1:0))%24,h12=hn%12||12;
  const base=h12===1?'Es la una':'Son las '+HW[h12];
  const tail=m===0?' en punto':m===15?' y cuarto':m===30?' y media':m===45?' menos cuarto':next?' menos '+MW[60-m]:' y '+MW[m];
  const fr=hn===12?'del mediodía':hn>=6&&hn<12?'de la mañana':hn>12&&hn<21?'de la tarde':hn>=1&&hn<6?'de la madrugada':'de la noche';
  return `${base}${tail} ${fr}`;
}
function mClock(body){
  let live=true,t=0,sec=0,snap=5,h24=true,showDig=true,showW=true,showMin=false,drag=null;
  const P=(r,a)=>[(r*Math.sin(a*Math.PI/180)).toFixed(1),(-r*Math.cos(a*Math.PI/180)).toFixed(1)];
  let g='',mins='';
  for(let i=0;i<60;i++){const big=i%5===0,[x1,y1]=P(big?150:158,i*6),[x2,y2]=P(168,i*6);g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--ink)" stroke-width="${big?5:2}" stroke-linecap="round"/>`}
  for(let i=1;i<=12;i++){const [x,y]=P(124,i*30);g+=`<text x="${x}" y="${y}" font-size="38" font-weight="800" text-anchor="middle" dominant-baseline="central" fill="var(--ink)">${i}</text>`}
  for(let i=0;i<12;i++){const [x,y]=P(192,i*30);mins+=`<text x="${x}" y="${y}" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#1e6fe0">${pad(i*5)}</text>`}
  const wrap=h('div',{html:`<svg class="clk" viewBox="-210 -210 420 420" width="360" height="360"><circle r="174" fill="var(--board)" stroke="var(--ink)" stroke-width="6"/>${g}<g class="mins" style="display:none">${mins}</g><line class="hh" y2="-92" stroke="#e03131" stroke-width="14" stroke-linecap="round"/><line class="mh" y2="-145" stroke="#1e6fe0" stroke-width="9" stroke-linecap="round"/><line class="sh" y1="22" y2="-155" stroke="#f08c00" stroke-width="3" stroke-linecap="round"/><circle r="11" fill="var(--ink)"/></svg>`});
  const svg=$('svg',wrap),hH=$('.hh',svg),mH=$('.mh',svg),sH=$('.sh',svg),minsG=$('.mins',svg);
  const dig=h('div',{class:'dig'}),words=h('div',{class:'words'});
  const modeSeg=h('div',{class:'seg'},
    h('button',{class:'on',onclick:()=>setLive(true)},...ib('clock','Hora real')),
    h('button',{onclick:()=>setLive(false)},...ib('select','Practicar')));
  function syncNow(){const d=new Date();t=d.getHours()*60+d.getMinutes();sec=d.getSeconds()}
  function setLive(v){live=v;$$('button',modeSeg).forEach((b,i)=>b.classList.toggle('on',i===(v?0:1)));if(v)syncNow();draw()}
  const step=dm=>{if(live)setLive(false);t=((t+dm)%1440+1440)%1440;draw()};
  const snapSeg=h('div',{class:'seg'},...[1,5,15,30].map(v=>h('button',{class:v===snap?'on':'',onclick:e=>{snap=v;$$('button',snapSeg).forEach(b=>b.classList.toggle('on',b===e.currentTarget))}},v+' min')));
  const tog=(lbl,get,set)=>{const b=h('button',{class:'btn ghost tog'+(get()?' on':''),onclick:()=>{set(!get());b.classList.toggle('on',get());draw()}},lbl);return b};
  function draw(){
    const m=t%60,hh=Math.floor(t/60);
    hH.setAttribute('transform',`rotate(${(t%720)/2+(live?sec/120:0)})`);
    mH.setAttribute('transform',`rotate(${m*6+(live?sec/10:0)})`);
    sH.style.display=live?'':'none';sH.setAttribute('transform',`rotate(${sec*6})`);
    minsG.style.display=showMin?'':'none';
    dig.style.display=showDig?'':'none';words.style.display=showW?'':'none';
    dig.innerHTML=h24?`${pad(hh)}:${pad(m)}`:`${hh%12||12}:${pad(m)} <small>${hh<12?'a. m.':'p. m.'}</small>`;
    words.textContent=timeWords(t);
  }
  // Arrastrar agujas: la de minutos mueve también la de horas (como un reloj real)
  const local=e=>{const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*420-210,y:(e.clientY-r.top)/r.height*420-210}};
  const angOf=p=>(Math.atan2(p.x,-p.y)*180/Math.PI+360)%360;
  const adiff=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d};
  function move(e){
    if(!drag)return;const a=angOf(local(e));
    if(drag==='m'){
      const nm=Math.round(a/6/snap)*snap%60;let dd=nm-t%60;if(dd>30)dd-=60;if(dd<-30)dd+=60;t+=dd;
    }else{
      let dd=a*2-t%720;if(dd>360)dd-=720;if(dd<-360)dd+=720;t=Math.round((t+dd)/snap)*snap;
    }
    t=((t%1440)+1440)%1440;draw();
  }
  svg.addEventListener('pointerdown',e=>{
    const p=local(e),r=Math.hypot(p.x,p.y);if(r<25||r>205)return;
    const a=angOf(p),md=adiff(a,(t%60)*6),hd=adiff(a,(t%720)/2);
    drag=r>110?'m':(Math.abs(md-hd)<15||hd<md?'h':'m'); // lejos del centro solo llega la aguja larga
    svg.setPointerCapture(e.pointerId);if(live)setLive(false);move(e);
  });
  svg.addEventListener('pointermove',move);
  const up=()=>drag=null;svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  body.append(modeSeg,wrap,dig,words,
    h('p',{class:'muted',style:'font-size:15px;margin:4px 0 10px'},'Aguja corta (roja): horas · Aguja larga (azul): minutos'),
    h('div',{class:'row c'},
      h('button',{class:'btn ghost',onclick:()=>step(-60)},'−1 h'),
      h('button',{class:'btn ghost',onclick:()=>step(-snap)},'− min'),
      h('button',{class:'btn ghost',onclick:()=>step(snap)},'+ min'),
      h('button',{class:'btn ghost',onclick:()=>step(60)},'+1 h'),
      h('button',{class:'btn','aria-label':'Hora aleatoria',onclick:()=>{setLive(false);t=Math.floor(Math.random()*(1440/snap))*snap;draw()}},ico('dice'))),
    h('div',{class:'muted',style:'font-size:15px;margin:12px 0 6px'},'Paso de la aguja de minutos'),snapSeg,
    h('div',{class:'row c',style:'margin-top:12px'},
      tog('Digital',()=>showDig,v=>showDig=v),tog('En palabras',()=>showW,v=>showW=v),
      tog('Minutos',()=>showMin,v=>showMin=v),tog('24 h',()=>h24,v=>h24=v)));
  syncNow();draw();
  const iv=setInterval(()=>{if(live){syncNow();draw()}},1000);
  return()=>clearInterval(iv);
}

/* ============ Regla graduada ============ */
const RUL=Object.assign({len:20,ppc:40,snap:true},S.ruler||{});
const RPAD=18,RH=112;
let ruler=null;
function applyRuler(){const r=ruler;r.el.style.left=r.x+'px';r.el.style.top=r.y+'px';r.el.style.transform=`rotate(${r.a}deg)`}
function renderRuler(){
  if(!ruler)return;
  const {len,ppc}=RUL,W=len*ppc+RPAD*2;let t='';
  for(let i=0;i<=len*10;i++){
    const x=(RPAD+i*ppc/10).toFixed(1),cm=i%10===0,half=i%5===0;
    if(!cm&&!half&&ppc<24)continue; // con centímetros muy pequeños se omiten los milímetros
    t+=`<line x1="${x}" y1="0" x2="${x}" y2="${cm?32:half?22:13}" stroke="#2b2108" stroke-width="${cm?2.2:1.2}"/>`;
    if(cm)t+=`<text x="${x}" y="50" text-anchor="middle" font-size="${ppc<30?14:20}" font-weight="800" fill="#2b2108">${i/10}</text>`;
  }
  ruler.body.innerHTML=`<svg width="${W}" height="${RH}" viewBox="0 0 ${W} ${RH}"><rect x="1" y="1" width="${W-2}" height="${RH-2}" rx="8" fill="rgba(255,222,100,.86)" stroke="#b8932a" stroke-width="2"/>${t}<text x="${RPAD}" y="${RH-16}" font-size="18" font-weight="800" fill="#2b2108">cm</text></svg>`;
  ruler.rot.style.left=(W+4)+'px';ruler.W=W;applyRuler();
}
function toggleRuler(){
  if(ruler){ruler.el.remove();ruler=null;closeWin('ruler-set');refreshRail();return}
  const el=h('div',{class:'ruler'}),body=h('div'),rot=h('div',{class:'rrot','aria-label':'Girar la regla'},ico('rotate')),ang=h('div',{class:'rang'});
  const btns=h('div',{class:'rbtns'},
    h('button',{'aria-label':'Ajustes de la regla',onclick:()=>openWin('ruler-set','Regla',mRuler,460)},ico('settings')),
    h('button',{'aria-label':'Quitar la regla',onclick:toggleRuler},ico('x')));
  el.append(body,rot,btns,ang);el.style.transformOrigin=`${RPAD}px 0px`; // gira alrededor del 0
  ruler={el,body,rot,ang,x:0,y:0,a:0,W:0};manip.append(el);renderRuler();
  ruler.x=Math.max(10,(stage.clientWidth-ruler.W)/2);ruler.y=stage.clientHeight*.5;applyRuler();
  // mover (doble toque: volver a horizontal)
  let d=null,lastTap=0;
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('.rrot,button'))return;
    if(manip.lastElementChild!==el)manip.append(el);el.setPointerCapture(e.pointerId);
    d={dx:e.clientX-ruler.x,dy:e.clientY-ruler.y};
    const now=Date.now();if(now-lastTap<350){ruler.a=0;applyRuler()}lastTap=now;
  });
  el.addEventListener('pointermove',e=>{if(!d)return;ruler.x=e.clientX-d.dx;ruler.y=e.clientY-d.dy;applyRuler()});
  const end=()=>d=null;el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  // girar con el asa azul
  let rd=null;
  rot.addEventListener('pointerdown',e=>{
    e.stopPropagation();rot.setPointerCapture(e.pointerId);
    const sr=stage.getBoundingClientRect();
    rd={ox:sr.left+ruler.x+RPAD,oy:sr.top+ruler.y,al:Math.atan2(55,ruler.W-RPAD+32)};
  });
  rot.addEventListener('pointermove',e=>{
    if(!rd)return;
    const st=RUL.snap?15:1;
    ruler.a=Math.round((Math.atan2(e.clientY-rd.oy,e.clientX-rd.ox)-rd.al)*180/Math.PI/st)*st;applyRuler();
    ang.textContent=(((ruler.a%360)+360)%360)+'°';ang.style.display='block';
  });
  const rend=()=>{rd=null;ang.style.display='none'};rot.addEventListener('pointerup',rend);rot.addEventListener('pointercancel',rend);
  refreshRail();
}
function mRuler(body){
  const lab=h('div',{class:'muted'});
  function saveRul(){S.ruler={...RUL};save();lab.textContent=`1 cm = ${RUL.ppc} px`;renderRuler()}
  const lenSeg=h('div',{class:'seg'},...[10,15,20,30].map(v=>h('button',{class:v===RUL.len?'on':'',onclick:e=>{RUL.len=v;$$('button',lenSeg).forEach(b=>b.classList.toggle('on',b===e.currentTarget));saveRul()}},v+' cm')));
  const sl=h('input',{type:'range',min:'20',max:'80',value:String(RUL.ppc),oninput:e=>{RUL.ppc=Number(e.target.value);saveRul()}});
  const snapB=h('button',{class:'btn ghost tog'+(RUL.snap?' on':''),onclick:()=>{RUL.snap=!RUL.snap;snapB.classList.toggle('on',RUL.snap);saveRul()}},'Girar de 15° en 15°');
  // además de girar, recoloca la regla en el centro por si había quedado fuera de la pantalla

    applyRuler()};
  body.append(h('div',{class:'lbl'},'Longitud'),lenSeg,
    h('div',{class:'lbl',style:'margin-top:16px'},'Tamaño del centímetro'),sl,lab,
    h('p',{class:'muted',style:'font-size:15px'},'Para que mida de verdad, apoya una regla real sobre la pantalla y mueve el deslizador hasta que coincidan.'),
    h('div',{class:'row c'},snapB,h('button',{class:'btn ghost',onclick:setA(0)},...ib('arrows-h','Horizontal')),h('button',{class:'btn ghost',onclick:setA(90)},...ib('arrows-v','Vertical'))));
  lab.textContent=`1 cm = ${RUL.ppc} px`;
}

/* ============ Monedas y billetes de euro ============ */
// Diámetros reales en mm y tamaños de billete en mm, para respetar las proporciones entre piezas
const COINS=[[1,16.25],[2,18.75],[5,21.25],[10,19.75],[20,22.25],[50,24.25],[100,23.25],[200,25.75]];
const BILLS=[[5,120,62,'#a7b0ba'],[10,127,67,'#ef7f78'],[20,133,72,'#6f9fe3'],[50,140,77,'#f3ab5c'],[100,147,77,'#5fbf87'],[200,153,77,'#e0c060']];
function coinSVG(v,d){

    im.onload=()=>{const k=Math.min(1,maxW/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.85))};

const mNum=s=>{const v=parseFloat(String(s).replace(',','.').replace('−','-'));return isFinite(v)?v:NaN};
const MCOL=['#e03131','#1e6fe0','#2f9e44','#f08c00','#7048e8','#0ca678'];

/* ============ Transportador ============ */
const PR={R:200,cx:260,cy:260,W:520,H:360};
let prot=null;
function protSvg(){
  const {R,cx,cy,W,H}=PR,P=(r,a)=>[cx+r*Math.cos(a*Math.PI/180),cy-r*Math.sin(a*Math.PI/180)];
  let t='';
  for(let a=0;a<=180;a++){
    const big=a%10===0,len=big?24:a%5===0?17:9,[x1,y1]=P(R,a),[x2,y2]=P(R-len,a);
    t+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--ink)" stroke-width="${big?2.2:1.1}"/>`;
    if(big){ // doble escala: exterior 0→180 de derecha a izquierda, interior al revés
      const [ox,oy]=P(R-42,a),[ix,iy]=P(R-72,a);
      t+=`<text x="${ox.toFixed(1)}" y="${oy.toFixed(1)}" transform="rotate(${a>90?180-a:-a} ${ox.toFixed(1)} ${oy.toFixed(1)})" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="800" fill="var(--ink)">${a}</text>`;
      t+=`<text x="${ix.toFixed(1)}" y="${iy.toFixed(1)}" transform="rotate(${a>90?180-a:-a} ${ix.toFixed(1)} ${iy.toFixed(1)})" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="800" fill="var(--accent)">${180-a}</text>`;
    }
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <path class="pbody" d="M${cx-R-14} ${cy+48}V${cy}H${cx-R}A${R} ${R} 0 0 1 ${cx+R} ${cy}H${cx+R+14}V${cy+48}Z" fill="rgba(110,170,255,.2)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M${cx-R+96} ${cy}A${R-96} ${R-96} 0 0 1 ${cx+R-96} ${cy}" fill="none" stroke="var(--ink)" stroke-opacity=".35" stroke-width="1.5"/>
    ${t}<line x1="${cx-R-14}" y1="${cy}" x2="${cx+R+14}" y2="${cy}" stroke="var(--ink)" stroke-width="2"/>
    <path d="M${cx-16} ${cy}H${cx+16}M${cx} ${cy-16}V${cy}" stroke="var(--ink)" stroke-width="2"/>
    <text class="plab" x="${cx}" y="${cy+36}" text-anchor="middle" font-size="34" font-weight="800" fill="var(--ink)"></text>
    <g class="pray"><line class="pl" x1="${cx}" y1="${cy}" stroke="#e03131" stroke-width="4" stroke-linecap="round"/>
    <circle class="ph" r="26" fill="#e03131" stroke="#fff" stroke-width="3"/></g></svg>`;
}
function protRay(a){
  const {R,cx,cy}=PR,x=cx+(R+34)*Math.cos(a*Math.PI/180),y=cy-(R+34)*Math.sin(a*Math.PI/180);
  prot.ang=a;

}
function protPlace(){const p=prot;p.el.style.left=p.x+'px';p.el.style.top=p.y+'px';p.el.style.transform=`rotate(${p.a}deg)`}
function toggleProt(){
  if(prot){prot.el.remove();prot=null;refreshRail();return}
  const {R,cx,cy,W,H}=PR;
  const rot=h('div',{class:'prot-h','aria-label':'Girar el transportador',style:`left:${cx+R-38}px;top:${cy+38}px`},ico('rotate'));
  const x=h('button',{class:'prot-h prot-x','aria-label':'Quitar el transportador',style:`left:${cx-R+16}px;top:${cy+42}px`,onclick:toggleProt},ico('x'));
  const el=h('div',{class:'prot',html:protSvg(),style:`width:${W}px;height:${H}px;transform-origin:${cx}px ${cy}px`});
  el.append(rot,x);manip.append(el);

  const sr=()=>stage.getBoundingClientRect(),front=()=>{if(manip.lastChild!==el)manip.append(el)}; // reinsertar suelta la captura, solo si hace falta

  el.addEventListener('pointermove',e=>{if(!d)return;prot.x=e.clientX-d.dx;prot.y=e.clientY-d.dy;protPlace()});
  const end=()=>d=null;el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);

  const ph=$('.ph',el);let rd=false;

  ph.addEventListener('pointermove',e=>{
    if(!rd)return;const r=sr();

    let v=Math.atan2(-dy,dx)*180/Math.PI+prot.a;v=((v+180)%360+360)%360-180;

/* ============ Recta numérica ============ */
function mLine(body){
  const L=S.mathLine=S.mathLine||{from:0,to:10,step:1};
  const W=860,PX=44,AY=190;
  let marks=[];
  const view=h('div'),info=h('div',{class:'mlinfo'}),msg=h('div',{class:'muted'}),labNote=h('div',{class:'muted',style:'font-size:15px;min-height:0'});
  const labSeg=h('div',{class:'seg',style:'max-width:420px'},[['all','Todas'],['main','Principales'],['none','Ninguna']].map(([k,t])=>h('button',{class:(L.labels||'all')===k?'on':'',onclick:e=>{
    L.labels=k;save();$$('button',labSeg).forEach(b=>b.classList.toggle('on',b===e.currentTarget));draw()}},t)));
  const mk=(v,lbl)=>h('input',{class:'numin',type:'text',inputmode:'decimal','aria-label':lbl,value:mFmt(v),onchange:apply});
  const inF=mk(L.from,'Desde'),inT=mk(L.to,'Hasta'),inS=mk(L.step,'Paso');
  function apply(){
    let f=mNum(inF.value),t=mNum(inT.value),s=mNum(inS.value);
    if(!(s>0)||!(t>f)||(t-f)/s>200){msg.textContent='Revisa los valores: «hasta» mayor que «desde», paso positivo y como máximo 200 marcas.';return}
    const n=Math.round((t-f)/s);t=f+n*s;
    Object.assign(L,{from:f,to:t,step:s});save();msg.textContent='';
    inF.value=mFmt(f);inT.value=mFmt(t);inS.value=mFmt(s);marks=[];draw();
  }
  const pre=[[0,10,1,'0–10'],[0,20,1,'0–20'],[0,100,10,'0–100 · de 10 en 10'],[-10,10,1,'−10 a 10'],[0,1,.1,'0–1 · de 0,1 en 0,1']];
  function draw(){
    const n=Math.round((L.to-L.from)/L.step),pitch=(W-2*PX)/n,X=i=>PX+i*pitch,V=i=>L.from+i*L.step;
    const maxc=Math.max(mFmt(V(0)).length,mFmt(V(n)).length,mFmt(V(Math.floor(n/2))).length);
    const k=[1,2,5,10,20,25,50,100].find(k=>k*pitch>=maxc*13+22)||200;
    // «Todas» solo si caben sin solaparse; si no, cae a «Principales»
    const fitsAll=pitch>=maxc*9.6+9;
    const lm=L.labels==='main'||L.labels==='none'?L.labels:'all',eff=lm==='all'&&!fitsAll?'main':lm;
    labNote.textContent=lm==='all'&&!fitsAll?'Hay demasiadas marcas para numerarlas todas: se muestran solo las principales.':'';
    let s=`<line x1="14" y1="${AY}" x2="${W-14}" y2="${AY}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>`;
    for(let i=0;i<=n;i++){
      const big=i%k===0;
      s+=`<line x1="${X(i)}" y1="${AY-(big?15:8)}" x2="${X(i)}" y2="${AY+(big?15:8)}" stroke="var(--ink)" stroke-width="${big?3:1.6}"/>`;
      if(eff==='none')continue;
      if(big)s+=`<text x="${X(i)}" y="${AY+50}" text-anchor="middle" font-size="24" font-weight="800" fill="var(--ink)">${mFmt(V(i))}</text>`;
      else if(eff==='all')s+=`<text x="${X(i)}" y="${AY+46}" text-anchor="middle" font-size="18" font-weight="700" fill="var(--muted)">${mFmt(V(i))}</text>`;
    }
    const top=AY-58;
    marks.forEach((i,j)=>{
      s+=`<line x1="${X(i)}" y1="${AY}" x2="${X(i)}" y2="${top}" stroke="var(--muted)" stroke-dasharray="4 5" stroke-width="2"/><circle cx="${X(i)}" cy="${AY}" r="9" fill="var(--accent)"/>`;
      if(!j)return;
      const a=X(marks[j-1]),b=X(i),dl=(i-marks[j-1])*L.step,col=dl>0?'#2f9e44':'#e03131',ch=clamp(Math.abs(b-a)*.9,50,170),cyy=top-ch;
      const ux=b-(a+b)/2,uy=top-cyy,m=Math.hypot(ux,uy),dx=ux/m,dy=uy/m;
      s+=`<path d="M${a} ${top}Q${(a+b)/2} ${cyy} ${b} ${top}" fill="none" stroke="${col}" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M${b} ${top}l${-14*dx+7*dy} ${-14*dy-7*dx}l${-14*dy} ${14*dx}Z" fill="${col}"/>
        <text x="${(a+b)/2}" y="${top-ch/2-8}" text-anchor="middle" font-size="26" font-weight="800" fill="${col}" stroke="var(--panel)" stroke-width="5" paint-order="stroke">${dl>0?'+':'−'}${mFmt(Math.abs(dl))}</text>`;
    });
    if(marks.length)s+=`<text x="${X(marks[marks.length-1])}" y="${AY-12}" text-anchor="middle" font-size="40">🐸</text>`;
    view.innerHTML=`<svg viewBox="0 0 ${W} 260" width="100%" style="display:block;touch-action:none;background:var(--board);border-radius:14px">${s}</svg>`;
    view.dataset.n=n;view.dataset.pitch=pitch;
    info.textContent=marks.length?(marks.length>1?marks.map(i=>mFmt(V(i))).join(' → '):'Estás en '+mFmt(V(marks[0]))):'Toca la recta para colocar la rana';
  }
  view.addEventListener('pointerdown',e=>{
    const svg=$('svg',view);if(!svg)return;
    const r=svg.getBoundingClientRect(),n=Number(view.dataset.n),pitch=Number(view.dataset.pitch);

/* ============ Fracciones ============ */
function mFrac(body){
  let den=4;const on=new Set();
  const circ=h('div'),bar=h('div'),fr=h('div',{class:'frbox'}),dec=h('div',{class:'muted'}),dn=h('b',{style:'font-size:36px;min-width:48px;text-align:center'});
  function draw(){
    [...on].forEach(i=>i>=den&&on.delete(i));
    const r=120,c=130,A=Math.PI*2/den;let s='',b='';
    for(let i=0;i<den;i++){
      const cl='fp'+(on.has(i)?' on':'');
      if(den===1)s=`<circle class="${cl}" data-i="0" cx="${c}" cy="${c}" r="${r}"/>`;
      else{const a0=-Math.PI/2+i*A,a1=a0+A;
        s+=`<path class="${cl}" data-i="${i}" d="M${c} ${c}L${(c+r*Math.cos(a0)).toFixed(2)} ${(c+r*Math.sin(a0)).toFixed(2)}A${r} ${r} 0 0 1 ${(c+r*Math.cos(a1)).toFixed(2)} ${(c+r*Math.sin(a1)).toFixed(2)}Z"/>`}
      b+=`<rect class="${cl}" data-i="${i}" x="${6+i*528/den}" y="6" width="${528/den}" height="70"/>`;
    }
    circ.innerHTML=`<svg viewBox="0 0 260 260" width="260" height="260" style="display:block">${s}</svg>`;
    bar.innerHTML=`<svg viewBox="0 0 540 82" width="100%" style="display:block;max-width:540px;margin:0 auto">${b}</svg>`;
    const k=on.size,q=k/den,ex=Math.abs(q*1000-Math.round(q*1000))<1e-9;
    fr.innerHTML=`<div class="fr"><b style="color:var(--coral)">${k}</b><i></i><b>${den}</b></div>`;
    dec.textContent=`${ex?'=':'≈'} ${mFmt(Math.round(q*1000)/1000)}`+(k===den?' · ¡el entero!':'');
    dn.textContent=den;
  }
  const hit=e=>{const t=e.target.dataset.i;if(t==null)return;const i=+t;on.has(i)?on.delete(i):on.add(i);draw()};
  circ.addEventListener('click',hit);bar.addEventListener('click',hit);
  const setD=d=>{den=clamp(d,1,12);draw()};
  body.append(
    h('div',{class:'row c'},h('span',{style:'font-size:20px'},'Partes (denominador):'),
      h('button',{class:'btn ghost big','aria-label':'Menos partes',onclick:()=>setD(den-1)},ico('minus')),dn,
      h('button',{class:'btn ghost big','aria-label':'Más partes',onclick:()=>setD(den+1)},ico('plus'))),
    h('div',{class:'row c',style:'justify-content:space-around;margin:12px 0'},circ,h('div',{},fr,dec)),
    bar,
    h('div',{class:'row c',style:'margin-top:12px'},
      h('button',{class:'btn',onclick:()=>{for(let i=0;i<den;i++)on.add(i);draw()}},'Rellenar todo'),
      h('button',{class:'btn ghost',onclick:()=>{on.clear();draw()}},'Vaciar')),
    h('p',{class:'muted',style:'margin:10px 0 0'},'Toca una parte para colorearla o quitarle el color'));

/* ============ Geoplano ============ */
function mGeo(body){
  let n=7,bands=[];
  const V=560,PD=40,sp=()=>(V-2*PD)/(n-1),pos=k=>PD+k*sp();
  const view=h('div'),list=h('div',{class:'row c',style:'margin-top:10px;min-height:44px'});
  const area=p=>Math.abs(p.reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+a[0]*b[1]-b[0]*a[1]},0))/2; // fórmula de Gauss
  const cur=()=>{const b=bands[bands.length-1];return b&&!b.closed&&!b.done?b:null};
  function draw(){
    let s=`<rect x="2" y="2" width="${V-4}" height="${V-4}" rx="16" fill="var(--board)" stroke="var(--line)" stroke-width="3"/>`,hits='';
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){
      s+=`<circle cx="${pos(i)}" cy="${pos(j)}" r="6" fill="var(--muted)"/>`;
      hits+=`<circle data-x="${i}" data-y="${j}" cx="${pos(i)}" cy="${pos(j)}" r="${Math.min(sp()/2,28)}" fill="transparent"/>`;
    }
    bands.forEach((b,bi)=>{
      const c=MCOL[bi%MCOL.length],pts=b.pts.map(([x,y])=>`${pos(x)},${pos(y)}`).join(' ');
      if(b.closed)s+=`<polygon points="${pts}" fill="${c}" fill-opacity=".3" stroke="${c}" stroke-width="6" stroke-linejoin="round"/>`;
      else if(b.pts.length>1)s+=`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>`;
      b.pts.forEach(([x,y])=>s+=`<circle cx="${pos(x)}" cy="${pos(y)}" r="10" fill="${c}"/>`);
      if(!b.closed&&!b.done&&b.pts.length>=3)s+=`<circle cx="${pos(b.pts[0][0])}" cy="${pos(b.pts[0][1])}" r="19" fill="none" stroke="${c}" stroke-width="4" stroke-dasharray="5 4"/>`;
      if(b.closed){
        const mx=b.pts.reduce((a,p)=>a+p[0],0)/b.pts.length,my=b.pts.reduce((a,p)=>a+p[1],0)/b.pts.length;
        s+=`<text x="${pos(mx)}" y="${pos(my)}" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="800" fill="var(--ink)" stroke="var(--board)" stroke-width="5" paint-order="stroke">${mFmt(area(b.pts))}</text>`;
      }
    });
    view.innerHTML=`<svg viewBox="0 0 ${V} ${V}" style="display:block;width:100%;max-width:min(100%,56vh);margin:0 auto;touch-action:none">${s}${hits}</svg>`;
    const cl=bands.map((b,bi)=>[b,bi]).filter(([b])=>b.closed);
    list.replaceChildren(...(cl.length?cl.map(([b,bi],k)=>{const a=area(b.pts);
      return h('div',{class:'gchip',style:`border-color:${MCOL[bi%MCOL.length]}`},`Goma ${k+1}: ${mFmt(a)} ${a===1?'cuadradito':'cuadraditos'}`)}):[h('span',{class:'muted'},'Toca los pinchos para tender la goma · toca el primero para cerrarla')]));
  }
  view.addEventListener('pointerdown',e=>{
    const t=e.target;if(t.dataset.x==null)return;
    const p=[+t.dataset.x,+t.dataset.y];let b=cur();
    if(!b){b={pts:[],closed:false,done:false};bands.push(b)}
    const last=b.pts[b.pts.length-1];
    if(last&&last[0]===p[0]&&last[1]===p[1])return;
    if(b.pts.length>=3&&b.pts[0][0]===p[0]&&b.pts[0][1]===p[1])b.closed=true;
    else if(!b.pts.length||!(b.pts.length<3&&b.pts[0][0]===p[0]&&b.pts[0][1]===p[1]))b.pts.push(p);
    draw();
  });
  const undo=()=>{
    const b=bands[bands.length-1];if(!b)return;
    if(b.closed)b.closed=false;else{b.pts.pop();if(!b.pts.length)bands.pop()}
    draw();
  };
  const newBand=()=>{const b=cur();if(b){if(b.pts.length)b.done=true;else bands.pop()}draw()};
  const seg=h('div',{class:'seg'},[5,7,10].map(k=>h('button',{class:k===n?'on':'',onclick:e=>{n=k;bands=[];$$('button',seg).forEach(x=>x.classList.toggle('on',x===e.currentTarget));draw()}},`${k}×${k}`)));
  body.append(seg,h('div',{style:'height:10px'}),view,list,
    h('div',{class:'row c',style:'margin-top:10px'},
      h('button',{class:'btn ghost',onclick:undo},...ib('undo','Deshacer punto')),
      h('button',{class:'btn ghost',onclick:newBand},...ib('plus','Nueva goma')),
      h('button',{class:'btn danger',onclick:()=>{bands=[];draw()}},...ib('trash','Borrar todo'))));
  draw();
}

/* ============ Asamblea: calendario, tiempo, emociones y días de cole ============ */
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayOnly=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const capFirst=s=>s.charAt(0).toUpperCase()+s.slice(1);
// S.festivos: ['dd/mm/aaaa', 'dd/mm/aaaa-dd/mm/aaaa', ...] → conjunto de 'aaaa-mm-dd'
let festKey=null,festSet=new Set();
function festivosSet(){
  const arr=Array.isArray(S.festivos)?S.festivos:[],key=arr.join('|');
  if(key===festKey)return festSet;
  const set=new Set(),re=/^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*(?:[-–]\s*(\d{1,2})\/(\d{1,2})\/(\d{4}))?\s*$/;
  for(const t of arr){
    const m=re.exec(String(t));if(!m)continue;
    const a=new Date(+m[3],m[2]-1,+m[1]),b=m[4]?new Date(+m[6],m[5]-1,+m[4]):a;
    for(let i=0;i<400;i++){const d=new Date(a.getFullYear(),a.getMonth(),a.getDate()+i);if(d>b)break;set.add(ymd(d))}
  }
  festKey=key;festSet=set;return set;
}
function isLective(date){const d=dayOnly(date),w=d.getDay();return w>0&&w<6&&!festivosSet().has(ymd(d))}
// Días lectivos entre dos fechas, ambas incluidas
function lectiveDays(from,to){
  const a=dayOnly(from),b=dayOnly(to);let n=0;
  for(let i=0;i<4000;i++){const d=new Date(a.getFullYear(),a.getMonth(),a.getDate()+i);if(d>b)break;if(isLective(d))n++}
  return n;
}
function schoolStart(){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(S.schoolStart||'');
  if(m)return new Date(+m[1],m[2]-1,+m[3]);
  const n=new Date();return new Date(n.getMonth()>=8?n.getFullYear():n.getFullYear()-1,8,8);
}

/* ============ Pictogramas ARASAAC ============ */
const PICTO_CREDIT='Pictogramas: Sergio Palao. Origen: ARASAAC (https://arasaac.org). Licencia: CC BY-NC-SA. Propiedad: Gobierno de Aragón (España).';
const PICTO_API=['https://api.arasaac.org/v1/pictograms/es/bestsearch/','https://api.arasaac.org/v1/pictograms/es/search/','https://api.arasaac.org/api/pictograms/es/search/'];
const PC_STOP=new Set('de del la el los las un una unos unas y e o u en con para por al a'.split(' '));
// «Encargado/a de la clase (hoy)» → «encargado de la clase»
const pcClean=t=>String(t).replace(/\([^)]*\)/g,' ').replace(/\/[a-zñ]{1,2}(?![a-zñ])/gi,'').replace(/[^\p{L}\p{N} ]+/gu,' ').replace(/\s+/g,' ').trim().toLowerCase();
const pcNorm=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'');
const pcPending=new Map();let pcDown=0;
// → id | 0 (la API respondió y no hay resultado) | null (error: no se puede afirmar nada)
async function pcQuery(q){
  let err=false;
  for(const base of PICTO_API){
    try{
      const ac=new AbortController(),to=setTimeout(()=>ac.abort(),8000);
      let r;try{r=await fetch(base+encodeURIComponent(q),{signal:ac.signal})}finally{clearTimeout(to)}
      if(r.status===404)continue; // ARASAAC responde 404 cuando no hay resultados
      if(!r.ok){err=true;continue}
      const j=await r.json(),id=Array.isArray(j)&&j[0]&&(j[0]._id!=null?j[0]._id:j[0].id);
      if(id)return Number(id);
    }catch{err=true}
  }
  return err?null:0;
}
function pcLookup(text){
  const clean=pcClean(text),key=pcNorm(clean);
  if(!key)return Promise.resolve(0);
  if(!S.picto||typeof S.picto!=='object')S.picto={};
  if(key in S.picto)return Promise.resolve(S.picto[key]);
  if(pcPending.has(key))return pcPending.get(key);
  if(Date.now()<pcDown)return Promise.resolve(null); // sin red hace poco: no insistir
  const p=(async()=>{
    const first=clean.split(' ').find(w=>w.length>2&&!PC_STOP.has(w)),qs=[clean];
    if(first&&first!==clean)qs.push(first);
    let id=0,unknown=false;
    for(const q of qs){const r=await pcQuery(q);if(r){id=r;break}if(r===null)unknown=true}
    if(id||!unknown){S.picto[key]=id;save();return id}
    pcDown=Date.now()+30000;return null;
  })().finally(()=>pcPending.delete(key));
  pcPending.set(key,p);return p;
}
function pictoImg(word){
  if(S.pictos===false)return null;
  const img=h('img',{class:'picto',alt:'',draggable:'false'});
  img.onload=()=>img.classList.add('ok');img.onerror=()=>img.remove();
  pcLookup(word).then(id=>{if(id)img.src=`https://static.arasaac.org/pictograms/${id}/${id}_300.png`;else img.remove()},()=>img.remove());
  return img;
}

/* ============ Tangram ============ */
const TK=65; // px por unidad: el cuadrado completo mide 4 × 4 unidades
// Piezas en la posición del cuadrado resuelto: 2 triángulos grandes, 1 mediano, 2 pequeños, cuadrado y romboide
const TANS=[
  ['L1','#e03131',[[0,0],[4,0],[2,2]]],
  ['L2','#1e6fe0',[[0,0],[2,2],[0,4]]],
  ['M','#2f9e44',[[4,2],[4,4],[2,4]]],
  ['S1','#fcc419',[[4,0],[4,2],[3,1]]],
  ['S2','#ae3ec9',[[2,2],[3,3],[1,3]]],
  ['SQ','#f08c00',[[2,2],[3,1],[4,2],[3,3]]],
  ['PA','#15aabf',[[0,4],[1,3],[3,3],[2,4]]]];
const TAN={};
TANS.forEach(([id,col,pts])=>{
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),y0=Math.min(...ys);
  const w=(Math.max(...xs)-x0)*TK,hh=(Math.max(...ys)-y0)*TK;
  const loc=pts.map(([x,y])=>[(x-x0)*TK,(y-y0)*TK]);
  const cx=loc.reduce((s,p)=>s+p[0],0)/loc.length,cy=loc.reduce((s,p)=>s+p[1],0)/loc.length;
  TAN[id]={x0:x0*TK,y0:y0*TK,loc,cx,cy};
  KINDS['tan'+id]={w,h:hh,g:'tan',tan:true,svg:`<svg width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}" style="overflow:visible"><polygon points="${loc.map(p=>p.join(',')).join(' ')}" fill="${col}" stroke="rgba(0,0,0,.45)" stroke-width="2" stroke-linejoin="round"/></svg>`};
});
const TAN_SQUARE=TANS.map(([id])=>({id,x:TAN[id].x0,y:TAN[id].y0,r:0,f:0}));
const tanSil=h('div',{class:'tansil'});manip.prepend(tanSil);
const tanEl=id=>{let el=pieces('tan'+id)[0];if(!el){el=addPiece('tan'+id,0,0);el.classList.add('tan')}return el};
function tanApply(el){const t=TAN[el.dataset.k.slice(3)];el.style.transformOrigin=`${t.cx}px ${t.cy}px`;el.style.transform=`rotate(${el.dataset.r||0}deg) scaleX(${el.dataset.f==='1'?-1:1})`}
function tanRotate(el){el.dataset.r=String(((Number(el.dataset.r)||0)+45)%360);tanApply(el)}
function tanFlip(){const el=tanEl('PA');el.dataset.f=el.dataset.f==='1'?'0':'1';tanApply(el)}
function tanPlace(arr,ox,oy){
  arr.forEach(a=>{const el=tanEl(a.id);el.dataset.r=String(a.r);el.dataset.f=a.f?'1':'0';el.classList.add('anim');el.style.left=(ox+a.x)+'px';el.style.top=(oy+a.y)+'px';tanApply(el)});
  setTimeout(()=>pieces(null,'tan').forEach(p=>p.classList.remove('anim')),400);
}
function tanSquare(){tanPlace(TAN_SQUARE,stage.clientWidth*.55-2*TK,stage.clientHeight/2-2*TK)}
let tanAct=null; // reto activo: {name,arr,ox,oy,polys:[{id,pts}],box:[x0,y0,x1,y1]}
// Desordena las piezas en una zona visible: fuera de la silueta, de la ventana del tangram (si sigue visible) y sin montarse entre sí
function tanScatter(){
  const W=stage.clientWidth,H=stage.clientHeight,sr=stage.getBoundingClientRect(),M=14;
  const sil=tanAct&&tanSil.firstChild?tanAct.box:null;
  const wr=wins.get('tan')?.win.getBoundingClientRect();
  const wb=wr&&wr.width>0&&wr.height>0?[wr.left-sr.left-12,wr.top-sr.top-12,wr.right-sr.left+12,wr.bottom-sr.top+12]:null;
  const hit=(a,b)=>a[0]<b[2]&&a[2]>b[0]&&a[1]<b[3]&&a[3]>b[1];
  const placed=[];
  TANS.forEach(([id])=>{
    const el=tanEl(id),r=45*Math.floor(Math.random()*8),pp=tanPoly(id,0,0,r,false);
    const bx0=Math.min(...pp.map(p=>p[0])),bx1=Math.max(...pp.map(p=>p[0])),by0=Math.min(...pp.map(p=>p[1])),by1=Math.max(...pp.map(p=>p[1]));
    let L=M-bx0,T=M-by0;
    for(let t=0;t<400;t++){
      const l=M-bx0+Math.random()*Math.max(0,W-2*M-(bx1-bx0)),tp=M-by0+Math.random()*Math.max(0,H-2*M-(by1-by0));
      const bb=[l+bx0,tp+by0,l+bx1,tp+by1];
      if(sil&&hit(bb,sil))continue;
      if(t<300&&wb&&hit(bb,wb))continue;
      if(t<150&&placed.some(q=>hit(bb,[q[0]-8,q[1]-8,q[2]+8,q[3]+8])))continue;
      L=l;T=tp;break;
    }
    placed.push([L+bx0,T+by0,L+bx1,T+by1]);
    el.dataset.r=String(r);el.dataset.f='0';el.classList.add('anim');
    el.style.left=L+'px';el.style.top=T+'px';tanApply(el);
  });
  setTimeout(()=>pieces(null,'tan').forEach(p=>p.classList.remove('anim')),400);
}
// Polígono de una pieza en coordenadas de la pizarra (misma cuenta que hace el CSS: volteo y luego giro)
function tanPoly(id,left,top,r,f){
  const t=TAN[id],a=r*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
  return t.loc.map(([x,y])=>{let dx=x-t.cx;const dy=y-t.cy;if(f)dx=-dx;return[left+t.cx+dx*c-dy*s,top+t.cy+dx*s+dy*c]});
}
function tanCurrent(){
  const arr=TANS.map(([id])=>{const el=tanEl(id);return{id,x:el.offsetLeft,y:el.offsetTop,r:Number(el.dataset.r)||0,f:el.dataset.f==='1'?1:0}});
  const all=arr.flatMap(a=>tanPoly(a.id,a.x,a.y,a.r,a.f)),mx=Math.min(...all.map(p=>p[0])),my=Math.min(...all.map(p=>p[1]));
  return arr.map(a=>({...a,x:Math.round(a.x-mx),y:Math.round(a.y-my)}));
}

  const W=stage.clientWidth,H=stage.clientHeight,ox=Math.min(W*.75-fw/2,W-fw-20),oy=(H-fh)/2;
  tanAct={name:name||'',arr,ox,oy,polys:arr.map((a,i)=>({id:a.id,pts:polys[i].map(([x,y])=>[x+ox,y+oy])})),
    box:[ox+Math.min(...all.map(p=>p[0]))-16,oy+Math.min(...all.map(p=>p[1]))-16,ox+fw+16,oy+fh+16]};
  if(typeof minimizeWin==='function')minimizeWin('tan');
  tanSil.innerHTML=`<svg width="${W}" height="${H}"><g fill="rgba(110,110,110,.38)" stroke="rgba(110,110,110,.38)" stroke-width="1.5" stroke-linejoin="round">${polys.map(p=>`<polygon points="${p.map(([x,y])=>`${(x+ox).toFixed(1)},${(y+oy).toFixed(1)}`).join(' ')}"/>`).join('')}</g></svg>`;

// Comprueba si cada polígono de la silueta tiene una pieza del mismo tipo con los vértices a menos de 18 px (en cualquier orden)
const TAN_GRP={L1:'L',L2:'L',S1:'S',S2:'S'};
function tanCheck(){
  if(!tanAct)return null;
  const ps=pieces(null,'tan');if(!ps.length)return null;
  const tol=18,num=s=>{const v=parseFloat(s);return isNaN(v)?0:v};
  const pcs=TANS.map(([id])=>{const el=tanEl(id);return{g:TAN_GRP[id]||id,pts:tanPoly(id,el.style.left?num(el.style.left):el.offsetLeft,el.style.top?num(el.style.top):el.offsetTop,Number(el.dataset.r)||0,el.dataset.f==='1')}});
  const T=tanAct.polys,near=(a,b)=>a.length===b.length&&a.every(p=>b.some(q=>Math.hypot(p[0]-q[0],p[1]-q[1])<=tol));
  const best=(i,used)=>{
    if(i===T.length)return 0;
    let m=best(i+1,used);
    pcs.forEach((p,j)=>{if(!(used>>j&1)&&p.g===(TAN_GRP[T[i].id]||T[i].id)&&near(T[i].pts,p.pts))m=Math.max(m,1+best(i+1,used|1<<j))});
    return m;
  };
  return T.length-best(0,0);
}
function tanClear(){pieces(null,'tan').forEach(p=>p.remove());tanSil.replaceChildren();tanAct=null}

    h('div',{class:'lbl',style:'margin-top:12px'},'Mis retos'),list,

      h('button',{class:'btn ghost',onclick:()=>{const n=prompt('Nombre de la figura:','Mi figura');if(!n||!n.trim())return;(S.tanFigs=S.tanFigs||[]).push({name:n.trim(),arr:tanCurrent()});save();renderList();toast('Figura guardada como reto')}},...ib('save','Guardar figura actual'))),

const NOTE_COLORS=['#ffe66d','#ff9fb2','#9be7a5','#9fd3ff','#ffc078','#d0bfff'];let noteN=0;
function addNote(){
  let ci=noteN%NOTE_COLORS.length;const k=noteN++%6;
  const nb=h('div',{class:'nb',contenteditable:'true',spellcheck:'false'});
  const n=h('div',{class:'note',style:`background:${NOTE_COLORS[ci]};left:${120+k*40}px;top:${70+k*36}px;z-index:${++zTop}`});
  const head=h('div',{class:'nh'},
    h('button',{'aria-label':'Color',onclick:()=>{ci=(ci+1)%NOTE_COLORS.length;n.style.background=NOTE_COLORS[ci]}},ico('palette')),
    h('button',{'aria-label':'Borrar',onclick:()=>n.remove()},ico('x')));
  n.append(head,nb);floaters.append(n);makeDrag(head,n);
  n.addEventListener('pointerdown',()=>n.style.zIndex=++zTop);nb.focus();
}

const spot=$('#spot'),spotCtl=$('#spotCtl');
const sp={on:false,x:innerWidth/2,y:innerHeight/2,r:170,shape:'circle'};
function spDraw(){
  const c=$('#hc'),r=$('#hr');
  if(sp.shape==='circle'){c.setAttribute('cx',sp.x);c.setAttribute('cy',sp.y);c.setAttribute('r',sp.r);c.style.display='';r.style.display='none'}
  else{const w=sp.r*2.6,hh=sp.r*1.5;r.setAttribute('x',sp.x-w/2);r.setAttribute('y',sp.y-hh/2);r.setAttribute('width',w);r.setAttribute('height',hh);r.setAttribute('rx',16);r.style.display='';c.style.display='none'}
}
function toggleSpot(on){
  sp.on=on===undefined?!sp.on:on;
  spot.style.display=sp.on?'block':'none';spotCtl.style.display=sp.on?'flex':'none';
  if(sp.on){sp.x=innerWidth/2;sp.y=innerHeight/2;spDraw()}
  refreshRail();
}

const pop=$('#pop');let popOwner=null;
function closePop(){pop.style.display='none';popOwner=null}
// place: 'right' (barra izquierda), 'above' (barra inferior) o 'below' (barra superior)
function openPop(owner,anchor,cols,nodes,place){
  if(popOwner===owner){closePop();return}
  if(place===true)place='above';
  pop.replaceChildren(...nodes);pop.style.gridTemplateColumns=`repeat(${cols},auto)`;
  pop.style.display='grid';popOwner=owner;
  const r=anchor.getBoundingClientRect();
  if(place==='above'||place==='below'){
    pop.style.left=clamp(r.left,8,innerWidth-pop.offsetWidth-8)+'px';
    pop.style.top=(place==='above'?Math.max(8,r.top-pop.offsetHeight-10):r.bottom+10)+'px';
  }else{
    pop.style.left=(r.right+10)+'px';
    pop.style.top=clamp(r.top,8,innerHeight-pop.offsetHeight-8)+'px';
  }
}

  $('#sStudents').value=(c.students||[]).join('\n');$('#sRoles').value=(c.roles||[]).join('\n');
}
function readClassUI(){const c=S.classes[dlgCls];c.students=lines($('#sStudents').value);c.roles=lines($('#sRoles').value)}
function openSettings(){
  syncClass();dlgCls=S.cls;fillClassUI();
  [1,2,3,4,5].forEach(d=>$('#sd'+d).value=(S.schedule[d]||[]).join('\n'));
  $('#sTheme').value=S.theme;$('#sUi').value=String(S.ui||1);$('#sPauta').value=String(S.pautaSize||1);
  $('#sPictos').checked=S.pictos!==false;
  $('#sStart').value=S.schoolStart||'';$('#sFest').value=(S.festivos||[]).join('\n');
  dlg.showModal();
}
$('#sClass').addEventListener('change',()=>{readClassUI();dlgCls=Number($('#sClass').value);fillClassUI()});
$('#sClsNew').onclick=()=>{readClassUI();const n=prompt('Nombre de la nueva clase:','Clase '+(S.classes.length+1));if(!n)return;S.classes.push({name:n.trim(),students:[],roles:[...S.roles],offset:0});dlgCls=S.classes.length-1;fillClassUI()};
$('#sClsRen').onclick=()=>{const c=S.classes[dlgCls];const n=prompt('Nuevo nombre:',c.name);if(n)c.name=n.trim();fillClassUI()};
$('#sClsDel').onclick=()=>{
  if(S.classes.length<2){toast('Tiene que quedar al menos una clase');return}
  if(!confirm(`¿Borrar la clase «${S.classes[dlgCls].name}» y su lista de alumnos?`))return;
  S.classes.splice(dlgCls,1);if(S.cls>=dlgCls&&S.cls>0)S.cls--;dlgCls=S.cls;fillClassUI();
};
$('#sSave').onclick=()=>{
  readClassUI();
  S.schedule={};[1,2,3,4,5].forEach(d=>S.schedule[d]=lines($('#sd'+d).value));
  S.theme=$('#sTheme').value;S.ui=Number($('#sUi').value);S.pautaSize=Number($('#sPauta').value);
  S.pictos=$('#sPictos').checked;S.schoolStart=$('#sStart').value||null;S.festivos=lines($('#sFest').value);
  const c=S.classes[dlgCls];S.cls=dlgCls;S.students=c.students;S.roles=c.roles;S.offset=c.offset||0;pool=[];
  save();dlg.close();closeAllWins();applyTheme();applyUi();tickClock();renderClassChip();toast('Ajustes guardados');
};
$('#sCancel').onclick=()=>dlg.close();
$('#sExport').onclick=()=>{
  syncClass();
  const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'})),download:'fori-datos.json'});document.body.append(a);a.click();a.remove();
};
$('#sImport').onclick=()=>$('#sFile').click();
$('#sFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{S={...structuredClone(DEF),...JSON.parse(await f.text())};save();location.reload()}catch{toast('Archivo no válido')}
});
// Ajustes: pulsación larga para evitar toques accidentales
(()=>{
  const b=$('#btnSettings');let timer=null,fired=false;
  b.addEventListener('pointerdown',()=>{fired=false;b.classList.add('holding');timer=setTimeout(()=>{fired=true;b.classList.remove('holding');openSettings()},700)});
  const cancel=()=>{clearTimeout(timer);b.classList.remove('holding')};
  b.addEventListener('pointerup',()=>{cancel();if(!fired)toast('Mantén pulsado el botón de Ajustes para abrirlos')});
  b.addEventListener('pointerleave',cancel);b.addEventListener('pointercancel',cancel);
})();

/* ============ Pantalla completa, tema, tamaño y arranque ============ */
$('#btnFs').onclick=()=>{
  if(document.fullscreenElement)document.exitFullscreen();
  else (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen||(()=>toast('Este navegador no permite pantalla completa')))
    .call(document.documentElement);
};
function applyTheme(){
  document.documentElement.dataset.theme=S.theme;
  $('meta[name=theme-color]').content=S.theme==='dark'?'#0B1430':'#13214A';
  drawBg();redraw();
}
function applyUi(){document.documentElement.style.setProperty('--ui',String(S.ui||1))}
let wl=null;
async function lock(){try{wl=await navigator.wakeLock.request('screen')}catch{}}
document.addEventListener('pointerdown',()=>{if(!wl)lock()},{once:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')lock()});
document.addEventListener('contextmenu',e=>{if(!e.target.closest('textarea,input,[contenteditable]'))e.preventDefault()});
document.addEventListener('gesturestart',e=>e.preventDefault());
// tocar fuera cierra el menú; si el toque cae en la pizarra, no se dibuja nada
document.addEventListener('pointerdown',e=>{if(pop.style.display==='grid'&&!e.target.closest('#pop,[data-pop]')){closePop();if(e.target===dr)e.stopPropagation()}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePop();if(sp.on)toggleSpot(false);else if(S.view==='clean')setView('full');setSel(null)}});
window.addEventListener('pagehide',()=>{commitEditor();clearTimeout(persistT);DB.set('board',{cur,pages:pages.map(p=>({strokes:p.strokes,bg:p.bg,img:p.img}))})});

$('#btnSettings').replaceChildren(ico('settings'));$('#btnView').replaceChildren(ico('view'));$('#btnFs').replaceChildren(ico('full'));$('#cornerBtn').replaceChildren(ico('view'));
applyUi();
buildLeft();buildRight();buildDock();renderClassChip();
if(typeof renderModeChip==='function')renderModeChip();
document.documentElement.dataset.theme=S.theme;
new ResizeObserver(fit).observe(stage);
fit();tickClock();setInterval(tickClock,1000);
setView(S.view||'full');
loadBoard();
if(location.protocol.startsWith('http')&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
